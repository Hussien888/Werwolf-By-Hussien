const botWait = (a, b) => TEST ? 5 : rnd(a, b);
/* Ein Computer-Spieler sieht seinen „Bildschirm“ und antwortet nach kurzer Bedenkzeit */
function botThink(p) {
  const v = p.view; if (!v || !v.rid || !G) return;
  if (v.live) { clearTimeout(p._lT); p._lT = setTimeout(() => botLive(p), botWait(800, 2600)); return; }
  if (!p.pending || p.pending.rid !== v.rid || p._rid === v.rid) return;
  p._rid = v.rid;
  const d = v.v === 'discuss' ? botWait(9000, 16000) : v.v === 'text' ? botWait(3500, 7000) : v.v === 'role' ? botWait(1500, 4000) : botWait(1200, 4500);
  setTimeout(() => { if (p.pending && p.pending.rid === v.rid) hostInput(p, {t: 'ans', rid: v.rid, val: botAnswer(p, v)}); }, d);
}
function botLive(p) {
  const v = p.view, H = MP.hunt; if (!v || !v.live || !H || H.done) return;
  const ids = v.cands.map(c => c.id);
  const human = G.players.find(q => !q.bot && isWolf(q) && H.sel[q.id] != null);
  let t = human ? H.sel[human.id] : null;
  if (t == null) { const o = Object.entries(H.sel).filter(([k]) => +k !== p.id).map(e => e[1]); if (o.length) t = o[0]; }
  if (t == null) {
    if (H.trail) { const inno = ids.filter(id => !isWolf(byId(id))); t = Math.random() < .15 || !inno.length ? any(ids) : any(inno); }
    else t = botPreyPick(p, ids);
  }
  if (H.sel[p.id] !== t && ids.includes(t)) hostInput(p, {t: 'sel', rid: v.rid, val: t});
}
/* Mörder/Werwölfe jagen bevorzugt die, denen das Dorf vertraut (gefährliche Rollen) */
function botPreyPick(p, ids) {
  const tr = G.trust || {}, best = ids.filter(id => (tr[id] || 0) > 0);
  return best.length && Math.random() < .6 ? best.sort((a, b) => (tr[b] || 0) - (tr[a] || 0))[0] : any(ids);
}
/* Verdacht eines Computer-Spielers */
function botSuspect(p, ids) {
  ids = ids.filter(id => id !== p.id); if (!ids.length) return null;
  const m = p.mem || (p.mem = {});
  if (p.alive && isWolf(p)) {
    const inno = ids.filter(id => !isWolf(byId(id))); if (!inno.length) return any(ids);
    const sus = G.sus || {}; const top = inno.slice().sort((a, b) => (sus[b] || 0) - (sus[a] || 0))[0];
    return Math.random() < .5 && (sus[top] || 0) > 0 ? top : any(inno);
  }
  const known = ids.filter(id => m[id] === 'w'); if (known.length) return any(known);
  let pool = ids.filter(id => m[id] !== 'g'); if (!pool.length) pool = ids;
  if (G.clue && Math.random() < .35 && pool.includes(G.clue.owner)) return G.clue.owner;
  const sus = G.sus || {}, top = pool.slice().sort((a, b) => (sus[b] || 0) - (sus[a] || 0))[0];
  return Math.random() < .4 && (sus[top] || 0) > 1 ? top : any(pool);
}
function botAnswer(p, v) {
  const t = (v.kicker || '') + ' ' + (v.title || '') + ' ' + (v.html || '');
  if (v.v === 'choice') {
    if (/Heiltrank/.test(t)) return Math.random() < .6 ? v.options[0].value : v.options[v.options.length - 1].value;
    return any(v.options).value;
  }
  if (v.v === 'text') return botWords(p);
  if (v.v !== 'pick') return true;
  const ids = v.cands.map(c => c.id), n = v.n || 1;
  if (n > 1) return shuffle(ids).slice(0, n);
  const others = ids.filter(id => id !== p.id);
  if (!others.length) return v.skip ? null : ids[0];
  if (/vergiften/.test(t)) return Math.random() < .25 ? botSuspect(p, others) : null;
  if (/Rabe/.test(t)) return Math.random() < .6 ? botSuspect(p, others) : null;
  if (/Schlächter/.test(t)) return Math.random() < .85 ? any(others) : null;
  if (/Vertrau/.test(t)) { if (p.alive && isWolf(p)) { const mates = others.filter(id => isWolf(byId(id))); return mates.length && Math.random() < .5 ? any(mates) : any(others); } const g = others.filter(id => (p.mem || {})[id] === 'g'); return g.length ? any(g) : (Math.random() < .2 ? null : any(others)); }
  if (/Seherin|Seele/.test(t)) { const un = others.filter(id => !(p.mem || {})[id]); const id = any(un.length ? un : others); (p.mem || (p.mem = {}))[id] = isWolf(byId(id)) ? 'w' : 'g'; return id; }
  if (/Beschützer/.test(t)) return any(ids);
  if (/Hauptmann/.test(t) && !/Gleichstand/.test(t)) { const g = others.filter(id => (p.mem || {})[id] === 'g'); return g.length ? any(g) : any(others); }
  if (v.skip && Math.random() < .08) return null;
  return botSuspect(p, others);
}
function botWords(p) {
  const L = alive().filter(q => q !== p), m = p.mem || {};
  if (!L.length) return 'Endlich Ruhe…';
  const known = L.find(q => m[q.id] === 'w');
  if (known && !isWolf(p)) return `${known.name} ist ${BL() ? 'ein Mörder' : 'ein Werwolf'}!`;
  const s = byId(botSuspect(p, L.map(q => q.id)) ?? L[0].id).name;
  return any(isWolf(p) ? [`${s} war es!`, `Traut ${s} nicht`, `${s} hat gelogen`, 'Ich war unschuldig…', `Rächt mich an ${s}`]

/* Computer-Spieler reden in der Diskussion mit */
function botChatter(L, isOn) {
  const bots = L.filter(p => p.bot && p.alive); if (!bots.length) return;
  const lines = [], used = new Set();
  const n = Math.min(bots.length, 3 + Math.floor(Math.random() * 2));

    const b = any(bots.filter(x => !used.has(x)) .length ? bots.filter(x => !used.has(x)) : bots); used.add(b);
    const tgt = botSuspect(b, alive().map(q => q.id)); if (tgt == null) continue; const s = byId(tgt).name, m = b.mem || {};

/* Eine Nacht-Phase: ALLE Lebenden bekommen gleichzeitig eine Aufgabe.

async function mpPhase(minMs, fn) {
  const L = alive(), t0 = Date.now();
  await Promise.all(L.map(async p => { await fn(p); p.pending = null; view(p, WAITV()); }));
  const rest = (TEST ? 0 : minMs) - (Date.now() - t0); if (rest > 0) await sleep(rest);
}

/* Live-Auswahl im Rudel/Kult: alle sehen, wen die anderen antippen. Sind sich alle einig, steht die Wahl fest. */
function makeLive(wolves, cands, o) {
  const H = {sel: {}, done: false, victim: null, trail: !!o.trail}; let resF; H.promise = new Promise(r => resF = r); let lockT = null;
  const nm = id => byId(id).name;
  const tags = () => { const t = {}; wolves.forEach(w => { const s = H.sel[w.id]; if (s != null) (t[s] = t[s] || []).push(w.name); }); const r = {}; for (const k in t) r[k] = o.tagIcon + ' ' + t[k].join(', '); return r; };
  const same = () => { const v = wolves.map(w => H.sel[w.id]); return v.every(x => x != null && x === v[0]) ? v[0] : null; };
  const status = () => {
    if (H.done) return o.doneTxt(esc(nm(H.victim)));
    const s = same(); if (s != null) return o.agreeTxt(esc(nm(s)), wolves.length > 1);
    return wolves.length > 1 ? o.many : o.one;
  };
  H.refresh = () => wolves.forEach(w => { if (w.view && w.view.hunt && w.view.rid === H.rids[w.id]) view(w, Object.assign({}, w.view, {tags: tags(), status: status(), locked: H.done})); });
  H.rids = {};
  const finish = (v, how) => { if (H.done) return; H.done = true; H.victim = v; clearTimeout(lockT); clearTimeout(H.to); H.refresh(); o.done(v, how); resF(v); };
  H.onSel = (w, v) => { if (H.done || !cands.some(p => p.id === v)) return; H.sel[w.id] = v; clearTimeout(lockT); const s = same(); if (s != null) lockT = setTimeout(() => finish(s), TEST ? 5 : 2500); H.refresh(); };
  H.force = () => {
    if (H.done) return;
    const c = {}; Object.values(H.sel).forEach(v => c[v] = (c[v] || 0) + 1); const mx = Math.max(0, ...Object.values(c)); const top = Object.keys(c).filter(k => c[k] === mx).map(Number);
    if (top.length) finish(any(top)); else if (o.fallback) finish(o.fallback(), 'haste'); else finish(any(cands).id);
  };
  H.to = setTimeout(H.force, TEST && !/longhunt/.test(location.search) ? 300 : o.timeout);
  H.join = w => {
    const rid = ++MP.rid; H.rids[w.id] = rid;
    view(w, {v: 'pick', hunt: true, live: true, rid, icon: o.icon, kicker: o.kicker, title: o.title, sub: o.sub(w), cls: 'wolf',
      cands: candsOf(cands), tags: tags(), status: status() + ` <span class="mute">(max. ${Math.round(o.timeout / 1000)} Sek.)</span>`});
    return H.promise;
  };
  return H;
}
function makeHunt(wolves, prey) {
  return makeLive(wolves, prey, {
    icon: T('wolfIcon'), tagIcon: T('wolfIcon'), kicker: T('huntK') + ' · Nacht ' + G.round, title: T('huntT'), timeout: 90000,
    sub: w => {
      const mates = wolves.filter(x => x !== w).map(x => esc(x.name));
      let s = mates.length ? `${T('pack')}: ${mates.join(', ')}` : T('alone');
      if (w.role === 'wildeskind') s = T('wildTurn') + ' ' + s;
      if (w.role === 'verfluchter') s = '🖤 Der Fluch hat dich verwandelt. Du bist jetzt einer der Mörder! ' + s;
      return s;

/* ---------- Morgen ---------- */
async function mpMorning() {
  G.phase = 'morning'; skyMP('day'); A.scene('day'); A.bell(3); clearViews();
  stage({icon: '🌅', kicker: 'Der Morgen graut', title: 'Tag ' + G.round, sub: 'Öffnet eure Augen.'});
  await say(line('dawn'));
  const deaths = [], add = (p, cause) => { if (p && p.alive && !deaths.some(d => d.p === p)) deaths.push({p, cause}); };
  if (G.knightCurse) { G.knightCurse = false; add(nextWolfFrom(G.knightSeat), 'knight'); }
  const v = G.n.victim != null ? byId(G.n.victim) : null;
  let turned = null; G.clue = null;
  if (v && v.alive) {
    if (G.n.protect === v.id) log(`${v.name} wurde vom Beschützer gerettet.`);
    else if (G.n.heal) {}
    else if (v.role === 'aeltester' && !G.elderHit) { G.elderHit = true; log(`${v.name} (Dorfältester) überlebt den Angriff.`); }
    else if (BL() && v.role === 'verfluchter' && !G.cursed) { G.cursed = true; turned = v; log(`${v.name} (Der Verfluchte) stirbt nicht, sondern wird zu einem der Mörder.`); }
    else {
      add(v, 'wolf'); if (v.role === 'ritter') { G.knightCurse = true; G.knightSeat = G.players.indexOf(v); }
      if (BL() && G.n.trail != null && G.signs) G.clue = {victim: v.id, owner: G.n.trail, sign: G.signs[G.n.trail], real: G.n.real, haste: G.n.haste};
    }
  }
  if (BL() && G.n.slash != null) {
    const s = byId(G.n.slash);
    if (s.alive) {
      if (G.n.protect === s.id) log(`${s.name} wurde vom Beschützer vor dem Schlächter gerettet.`);
      else if (s.role === 'aeltester' && !G.elderHit) { G.elderHit = true; log(`${s.name} (Dorfältester) überlebt den Schlächter.`); }
      else add(s, 'slash');
    }
  }
  if (G.n.white != null) add(byId(G.n.white), 'white');
  if (G.n.poison != null) add(byId(G.n.poison), 'poison');
  if (!deaths.length) { A.chime(); stage({icon: '🕊️', kicker: 'Tag ' + G.round, title: 'Niemand ist gestorben', sub: BL() ? 'Noch nicht.' : 'Alle haben die Nacht überlebt.'}); await say(line('nobody')); }
  else {
    stage({icon: '🩸', kicker: 'Tag ' + G.round, title: deaths.length > 1 ? deaths.length + ' Tote' : 'Ein Toter', sub: 'Die Nacht hat ihren Tribut gefordert.'}); fx('blood');
    await say(line('some'));
    await mpKill(shuffle(deaths));
  }
  if (turned) {
    stage({icon: '🖤', kicker: 'Tag ' + G.round, title: 'Eine Seele ist erkaltet', sub: 'Jemand unter euch wurde in dieser Nacht verwandelt.'});
    A.whisper(.5); await say(line('turned'));
    MP.players.forEach(sendPriv);
  }
  if (checkWin()) return;
  const b = alive().find(p => p.role === 'baer');
  if (b) {
    const hit = neighbors(b).some(isWolf);
    if (hit) { A.growl(); stage({icon: '🐻', kicker: 'Der Bär', title: 'Der Bär brummt!', sub: `Neben ${esc(b.name)} ${T('bear')}`}); await say(line('bear_yes', {name: b.name})); }
    else { stage({icon: '🐻', kicker: 'Der Bär', title: 'Der Bär bleibt ruhig', sub: ''}); await say(line('bear_no')); }
  }
  // Das Dorf flüstert: Ergebnis der geheimen Verdachts- & Vertrauensumfrage
  const top = (o) => Object.entries(o).map(([k, n]) => [byId(+k), n]).filter(([p]) => p.alive).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const s = top(G.sus || {}), t = top(G.trust || {});
  if (s.length) {
    stage({icon: '🗣️', kicker: 'Das Dorf flüstert…', title: 'Heimliche Stimmen der Nacht',
      html: `<div class="whisper"><div><div class="kicker">👁️ Verdächtigt</div>${s.map(([p, n]) => `<div class="wrow"><b>${esc(p.name)}</b><span>${n}×</span></div>`).join('')}</div>${t.length ? `<div><div class="kicker">🕯️ Vertraut</div>${t.map(([p, n]) => `<div class="wrow"><b>${esc(p.name)}</b><span>${n}×</span></div>`).join('')}</div>` : ''}</div>`});
    await say(line('whisper', {name: s[0][0].name}));
    await sleep(2500);
  }
  // Blutnacht: Die Toten haben jemanden heimgesucht
  if (BL() && G.haunt != null && byId(G.haunt).alive) {
    const h = byId(G.haunt);
    stage({icon: '👻', kicker: 'Die Toten haben gewählt', title: esc(h.name) + ' wurde heimgesucht', sub: 'Bei der Abstimmung zählt eine Stimme mehr gegen ' + esc(h.name) + '.'});
    A.whisper(.6); await say(line('haunt', {name: h.name}));
  } else G.haunt = null;
}

const cleanWords = s => String(s == null || s === true ? '' : s).replace(/[\u0000-\u001f|<>]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
const capF = s => s.charAt(0).toUpperCase() + s.slice(1);

}

async function mpKill(list) {
  const q = list.slice();
  while (q.length) {
    const {p, cause} = q.shift(); if (!p.alive) continue;
    const bl = BL(), gallows = cause === 'vote' || cause === 'scape';
    if (bl && gallows) await lastWords(p, 'gallows');
    p.alive = false; p.cause = causeT(cause) + ' (' + (G.phase === 'day' ? 'Tag ' : 'Nacht ') + G.round + ')'; p.pending = null;
    log(`${p.name} stirbt (${causeT(cause)}) – war ${roleName(p)}.`);
    const other = G.lovers.includes(p.id) ? byId(G.lovers.find(x => x !== p.id)) : null;
    const key = {wolf: 'd_night', poison: 'd_night', white: 'd_night', slash: 'd_slash', love: 'd_love', vote: 'd_vote', hunter: 'd_hunter', knight: 'd_knight', scape: 'd_scape'}[cause];
    const lovedOne = cause === 'love' ? (G.lovers.map(byId).find(x => x !== p) || {}).name : '';
    A.gong(); fx('blood'); if (bl && (cause === 'wolf' || cause === 'poison' || cause === 'slash')) A.knife();
    const sg = bl && S.reveal && signOf(p) ? `<div class="small mute" style="margin-top:6px">Zeichen: ${signTxt(p)}</div>` : '';
    stage({icon: S.reveal ? ROLES[p.role].i : '🪦', kicker: '† ' + causeT(cause), title: esc(p.name), sub: '', cls: 'dead',
      html: S.reveal ? `<div class="tomb"><div class="small mute">war</div><div class="rn">${roleName(p)}</div>${sg}</div>` : '<p class="mute">Die Rolle bleibt ein Geheimnis.</p>'});
    view(p, null);
    await say(bl && (cause === 'wolf' || cause === 'poison') ? murderScene(p) : line(key, {name: p.name, other: lovedOne}));
    await sleep(2200);
    if (bl && !gallows) await lastWords(p, cause === 'love' || cause === 'hunter' ? 'dying' : 'wall');
    if (bl && cause === 'wolf' && G.clue && G.clue.victim === p.id) await revealClue(p);
    else if (bl && cause === 'poison') { stage({icon: '❔', kicker: 'Am Tatort', title: 'Keine Spur', sub: 'Kein Zeichen. Nichts.'}); await say(line('noclue')); }
    if (p.role === 'engel' && G.round === 1) { G.winner = 'engel'; G.angel = p; stage({icon: '😇', kicker: 'Ein Wunder', title: esc(p.name) + ' war der Engel!', sub: 'Er gewinnt allein.'}); await say(line('angel', {name: p.name})); return; }
    if (other && other.alive) q.unshift({p: other, cause: 'love'});
    if (G.model === p.id && !G.wildTurned) { const k = G.players.find(x => x.role === 'wildeskind'); if (k && k.alive) { G.wildTurned = true; log(`${k.name} (Wildes Kind) verliert sein Vorbild und wird ${bl ? 'zum Mörder' : 'zum Werwolf'}.`); sendPriv(k); } }
    if (p.role === 'jaeger') {
      A.growl(); stage({icon: '🏹', kicker: 'Letzter Schuss', title: `${esc(p.name)} war der Jäger!`, sub: 'Er hebt mit letzter Kraft sein Gewehr…'});
      const sp = say(line('hunter', {name: p.name}));
      const c = alive();
      if (c.length) { const id = await ask(p, {v: 'pick', icon: '🏹', kicker: 'Letzter Schuss', title: 'Wen nimmst du mit in den Tod?', cands: candsOf(c), ok: 'Schießen', cls: 'wolf'}); p.pending = null; view(p, null); await sp; A.shot(); q.unshift({p: byId(id), cause: 'hunter'}); } else await sp;
    }
    if (G.captain === p.id) {
      G.captain = null; const c = alive().filter(x => !q.some(e => e.p === x));
      if (c.length) {
        stage({icon: '🎖️', kicker: 'Nachfolger', title: `${esc(p.name)} ernennt einen Nachfolger`, sub: 'Der Hauptmann wählt auf seinem Handy…'});
        const sp = say(line('captain_dead', {name: p.name}).replace('Nimm das Handy und wähle.', 'Wähle auf deinem Handy.'));
        const id = await ask(p, {v: 'pick', icon: '🎖️', kicker: 'Nachfolger', title: 'Wer wird neuer Hauptmann?', cands: candsOf(c)}); p.pending = null; view(p, null);
        await sp; G.captain = id; log(`${byId(id).name} wird neuer Hauptmann.`); sendPub();
        stage({icon: '🎖️', kicker: 'Neuer Hauptmann', title: esc(byId(id).name), sub: 'Seine Stimme zählt doppelt.'}); await say(line('captain_set', {name: byId(id).name}));
      }
    }
  }
  MP.players.forEach(sendPriv);
}

async function mpVoteAll(L, opts, weight) {
  const tally = {}, votes = {}; L.forEach(p => tally[p.id] = 0);
  let done = 0;
  await Promise.all(opts.voters.map(async v => {
    const id = await ask(v, Object.assign({v: 'pick', cands: candsOf(L.filter(p => p !== v))}, opts.view(v)));
    votes[v.id] = id; if (id != null) tally[id] += weight(v);
    view(v, WAITV('🗳️', 'Stimme abgegeben', 'Warte auf die anderen…'));
    done++; if (opts.onProgress) opts.onProgress(done);
  }));
  return {tally, votes};
}

function mpDiscuss() {
  return new Promise(res => {
    const L = alive(), need = Math.floor(L.length / 2) + 1, ready = new Set();
    let left = S.discuss * 60, fin = false, iv;
    const setT = () => { MP.pub.timer = S.discuss ? {id: ++MP.tid, rem: left, total: Math.max(left, S.discuss * 60)} : null; };
    setT(); MP.pub.ready = {n: 0, of: L.length, need};
    stage({icon: BL() ? '🩸' : '🗣️', kicker: 'Tag ' + G.round + ' · Beratung', title: T('who'), sub: BL() ? 'Wem gehört die Spur? Wer lügt? Wer bereit ist, tippt „Bereit zur Abstimmung“.' : 'Diskutiert! Wer bereit ist, tippt „Bereit zur Abstimmung“.', timer: true});
    const done = () => { if (fin) return; fin = true; clearInterval(iv); MP.pub.timer = null; MP.pub.ready = null; MP.discuss = null; L.forEach(p => { p.pending = null; view(p, null); }); res(); };
    MP.discuss = {skip: done, add: () => { left += 60; setT(); sendPub(); }};
    L.forEach(p => ask(p, {v: 'discuss'}).then(() => {
      if (fin) return; ready.add(p.id); MP.pub.ready = {n: ready.size, of: L.length, need}; view(p, {v: 'discuss', ready: true}); sendPub();
      if (ready.size >= need) done();
    }));
    say(S.discuss ? line('discuss', {min: S.discuss}) : line('discuss_free'));
    MP.chat = []; if (MP.offline) botChatter(L, () => !fin);
    iv = setInterval(() => {
      if (!S.discuss || fin) return;
      left--;
      if (left === 30) say(line('t30'));
      if (left <= 10 && left > 0) A.beat(1);
      if (left <= 0) { A.bell(1, 147); done(); }
    }, TEST ? 1 : 1000);
  });
}
async function mpVote() {
  const L = alive(), voters = L.filter(p => !G.deppOut.includes(p.id));
  L.filter(p => !voters.includes(p)).forEach(p => view(p, WAITV('🤪', 'Du darfst nicht abstimmen', 'Der Dorfdepp hat keine Stimme mehr.')));
  const capId = G.captain;
  stage({icon: '⚖️', kicker: 'Das Urteil', title: 'Abstimmung', sub: `0 von ${voters.length} haben abgestimmt`});
  const {tally, votes} = await mpVoteAll(L, {voters,
    view: v => ({icon: '⚖️', kicker: 'Abstimmung' + (capId === v.id ? ' · Du bist Hauptmann (2 Stimmen)' : ''), title: BL() ? 'Wer soll hängen?' : 'Wer soll sterben?', skip: 'Enthaltung', ok: 'Stimme abgeben', cls: 'wolf'}),
    onProgress: n => stage({icon: '⚖️', kicker: 'Das Urteil', title: 'Abstimmung', sub: `${n} von ${voters.length} haben abgestimmt`})},
    v => capId === v.id ? 2 : 1);
  if (G.raven != null && tally[G.raven] != null) tally[G.raven] += 2;
  const hId = BL() && G.haunt != null && tally[G.haunt] != null ? G.haunt : null;
  if (hId != null) tally[hId] += 1;
  clearViews();
  const max = Math.max(...Object.values(tally)), top = max > 0 ? L.filter(p => tally[p.id] === max) : [];
  const sorted = L.slice().sort((a, b) => tally[b.id] - tally[a.id]);
  A.beat(3);
  const who = S.showVotes ? `<div class="vlist">${voters.map(v => `<div><b>${esc(v.name)}</b>${capId === v.id ? ' 🎖️' : ''} → ${votes[v.id] != null ? esc(byId(votes[v.id]).name) : '<span class="mute">Enthaltung</span>'}</div>`).join('')}${G.raven != null ? `<div class="mute">🐦‍⬛ Rabe: +2 auf ${esc(byId(G.raven).name)}</div>` : ''}${hId != null ? `<div class="mute">👻 Spuk: +1 auf ${esc(byId(hId).name)}</div>` : ''}</div>` : '';
  stage({icon: '⚖️', kicker: 'Das Urteil', title: 'Die Stimmen', html: `<div class="bars">${sorted.map(p => `<div class="bar ${top.includes(p) ? 'top' : ''}"><i style="width:${max ? tally[p.id] / max * 100 : 0}%"></i><span>${esc(p.name)}</span><span>${tally[p.id]}</span></div>`).join('')}</div>${who}`});
  log(`Abstimmung: ${sorted.filter(p => tally[p.id]).map(p => p.name + ' ' + tally[p.id]).join(', ') || 'keine Stimmen'}.`);
  await sleep(S.showVotes ? 7000 : 4500);
  let target = null, cause = 'vote';
  if (top.length === 1) target = top[0];
  else if (top.length > 1) {
    const sb = alive().find(p => p.role === 'suendenbock');
    if (sb) { target = sb; cause = 'scape'; }
    else if (G.captain != null && byId(G.captain).alive) {
      const c = byId(G.captain);
      stage({icon: '🎖️', kicker: 'Gleichstand!', title: 'Der Hauptmann entscheidet', sub: `${esc(c.name)} wählt auf seinem Handy…`}); const sp = say(line('tie_cap'));
      const id = await ask(c, {v: 'pick', icon: '🎖️', kicker: 'Gleichstand – du entscheidest', title: 'Wer stirbt?', cands: candsOf(top), ok: 'Urteil fällen', cls: 'wolf'}); c.pending = null; view(c, null);
      await sp; target = byId(id);
    } else { stage({icon: '🤷', kicker: 'Das Urteil', title: 'Gleichstand', sub: 'Heute stirbt niemand.'}); await say(line('tie_none')); log('Gleichstand – niemand stirbt.'); return; }
  } else { stage({icon: '🤷', kicker: 'Das Urteil', title: 'Keine Stimmen', sub: 'Heute stirbt niemand.'}); await say(line('tie_none')); return; }
  if (target.role === 'depp' && cause === 'vote' && !G.deppOut.includes(target.id)) {
    G.deppOut.push(target.id); log(`${target.name} ist der Dorfdepp und überlebt, darf aber nicht mehr abstimmen.`);
    stage({icon: '🤪', kicker: 'Das Urteil', title: esc(target.name) + ' ist der Dorfdepp!', sub: 'Er überlebt, darf aber nicht mehr abstimmen.'}); sendPriv(target);
    await say(line('depp', {name: target.name})); return;
  }
  await mpKill([{p: target, cause}]);
  checkWin();
}

async function mpJoin(code, name, bIdx) {
  if (!secureOK()) return errScreen('So geht es nicht', FILE_HELP);
  connScreen('Verbinde…', 'Suche das Spiel ' + esc(code));
  try {
    MP.on = true; MP.host = false; MP.code = code; MP.name = name;
    MP.rk = await CR.room(code); MP.kp = await CR.pair(); MP.myPub = await CR.pub(MP.kp);
    MP.cid = store.get('cid_' + code, null) || ('p' + Math.random().toString(36).slice(2, 12)); store.set('cid_' + code, MP.cid);
    const order = BROKERS.slice(); if (bIdx != null && order[bIdx]) order.unshift(order.splice(bIdx, 1)[0]);
    // Alle Server gleichzeitig verbinden; wo zuerst das Spiel gefunden wird, bleiben wir
    const conns = []; let anyUp = false;
    order.forEach(u => {
      const mq = new MQ(u); conns.push(mq);
      mq.connect().then(() => {
        if (MP.mq) { mq.close(); return; }
        anyUp = true; mq.afterConnect();
        mq.onmsg = (t, s) => {
          if (!MP.mq && t === TP + code + '/info' && s) { MP.mq = mq; conns.forEach(c => { if (c !== mq) { c.onmsg = null; c.close(); } }); }
          if (MP.mq === mq) clientMsg(t, s).catch(e => console.error(e));
        };
        mq.sub(TP + code + '/info'); mq.sub(TP + code + '/pub'); mq.sub(TP + code + '/p/' + MP.cid);
      }, () => { mq.closed = true; });
    });
    for (let i = 0; i < 60 && !MP.hostKey; i++) await new Promise(r => setTimeout(r, 200));
    if (!MP.hostKey) {
      conns.forEach(c => { c.onmsg = null; c.close(); }); MP.mq = null; MP.on = false;
      return anyUp ? errScreen('Spiel nicht gefunden', `Unter dem Code <b>${esc(code)}</b> läuft gerade kein Spiel. Prüfe den Code und ob der Spielleiter den Raum offen hat.`, () => mpJoinScreen(code, bIdx))
                   : errScreen('Keine Verbindung', 'Keiner der Spielserver ist von hier aus erreichbar. ' + NET_HELP, () => mpJoin(code, name, bIdx));
    }
    MP.netOk = true;
    MP.mq.onstate = ok => { MP.netOk = ok; netDot(); if (ok) hello(); };
    keepAwake();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && MP.mq) { hello(); keepAwake(); } });
    window.addEventListener('pagehide', () => { try { CL.send({t: 'bye'}); } catch (e) {} });
    setInterval(() => { if (MP.mq && MP.hostKey) CL.send({t: 'ping'}); }, 8000);
    // Bis der Spielleiter antwortet, wiederholt "hallo" sagen
    const tries = setInterval(() => { if (CL.priv) clearInterval(tries); else hello(); }, 4000);
  } catch (e) { console.error(e); MP.on = false; errScreen('Keine Verbindung', 'Keiner der Spielserver ist erreichbar. ' + NET_HELP, () => mpJoin(code, name, bIdx)); }
}
async function hello() { if (!MP.mq || !MP.hostPub) return; MP.mq.pub(TP + MP.code + '/up', JSON.stringify({c: MP.cid, t: 'hello', d: await CR.seal(MP.rk, {name: MP.name, pub: MP.myPub})})); }
async function clientMsg(t, s) {
  const T = TP + MP.code;
  if (t === T + '/info') {
    if (!s) { if (MP.hostKey) { MP.ended = true; CL.render(true); } return; }
    let o; try { o = await CR.open(MP.rk, s); } catch (e) { return; }
    if (o.hostPub !== MP.hostPub) { MP.hostPub = o.hostPub; MP.hostKey = await CR.shared(MP.kp, o.hostPub); MP.ended = false; CL.seqP = 0; hello(); }
  } else if (t === T + '/pub') {
    if (!s) return; let o; try { o = await CR.open(MP.rk, s); } catch (e) { return; } CL.onPub(o);
  } else if (t === T + '/p/' + MP.cid) {
    if (!s || !MP.hostKey) return; let o; try { o = await CR.open(MP.hostKey, s); } catch (e) { return; }
    if (o.err) { MP.err = o.err; CL.render(true); return; }
    CL.onPriv(o);
  }
}

/* =========================================================
   CLIENT-ANZEIGE (für Spieler und für das Handy des Spielleiters)
   ========================================================= */
const CL = { pub: null, priv: null, seqP: 0, sel: {}, sent: {}, draft: {}, key: '', timerId: 0, timerEnd: 0, timerTotal: 1, fxN: 0, lastRid: null, lastPub: 0 };
CL.send = d => {
  if (MP.host) { if (MP.me) hostInput(MP.me, d); return; }
  if (!MP.mq || !MP.hostKey) return;
  CR.seal(MP.hostKey, d).then(x => MP.mq.pub(TP + MP.code + '/up', JSON.stringify({c: MP.cid, d: x})));
};
CL.onPub = p => {
  const old = CL.pub; CL.pub = p; CL.lastPub = Date.now();
  if (p.timer) { if (p.timer.id !== CL.timerId) { CL.timerId = p.timer.id; CL.timerEnd = Date.now() + p.timer.rem * 1000; CL.timerTotal = p.timer.total; } } else CL.timerId = 0;
  if (p.fx && p.fx.n !== CL.fxN) { const first = !CL.fxN; CL.fxN = p.fx.n; if (!first) { flash(); vib([40, 40, 80]); } }
  if (!MP.host) { caption(p.cap || ''); setSky(p.sky || 'night'); if ((p.var || 'klassisch') !== VAR) { applyTheme(p.var); CL.key = ''; } }
  if (p.ph === 'game' || p.ph === 'end') document.body.classList.add('ingame');
  CL.render();
};
CL.onPriv = d => {
  if (d.v <= CL.seqP) return; CL.seqP = d.v; CL.priv = d;
  const v = d.view;
  if (v && v.rid && v.rid !== CL.lastRid) {
    CL.lastRid = v.rid; if (CL.pub && CL.pub.sky === 'night') vib(v.scare ? [300, 80, 120, 80, 600] : 35);
    if (v.scare) { document.body.classList.remove('scared'); void document.body.offsetWidth; document.body.classList.add('scared'); setTimeout(() => document.body.classList.remove('scared'), 1900); }
  }
  CL.render();
};

function timerHTML(btn) {
  const P = CL.pub, R = 110, C = 2 * Math.PI * R;
  const t = P && P.timer ? `<div class="timer" id="tm"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/><circle id="arc" cx="120" cy="120" r="${R}" fill="none" stroke="var(--gold2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0" style="transition:stroke-dashoffset .5s linear"/></svg><div class="t" id="tt"></div></div>` : '';
  const r = P && P.ready ? `<p class="center mute small" id="rdy">✋ ${P.ready.n} von ${P.ready.of} bereit · ab ${P.ready.need} wird abgestimmt</p>` : '';
  return t + r + (btn || '');
}
function tickTimer() {
  const tt = $('#tt'); if (!tt || !CL.timerId) return;
  const left = Math.max(0, Math.round((CL.timerEnd - Date.now()) / 1000));
  tt.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  const C = 2 * Math.PI * 110; const a = $('#arc'); if (a) a.style.strokeDashoffset = C * (1 - left / Math.max(CL.timerTotal, left, 1));
  $('#tm').classList.toggle('low', left <= 10);
}
setInterval(() => {
  tickTimer();
  if (MP.on && !MP.host && CL.pub && CL.pub.ph !== 'end') {
    const lost = Date.now() - CL.lastPub > 16000 || !MP.netOk;
    const b = $('#lostbar'); if (lost && !b) { const d = document.createElement('div'); d.id = 'lostbar'; d.textContent = '⚠️ Verbindung zum Spielleiter unterbrochen… versuche es weiter'; document.body.appendChild(d); } else if (!lost && b) b.remove();
  }
}, 500);

function viewHTML(v, me) {
  const sent = CL.sent[v.rid];
  if (v.v === 'pick') {
    const sel = CL.sel[v.rid] || [], tags = v.tags || {};
    return `<div class="scr pick ${v.cls || ''}">${v.kicker ? `<div class="kicker center">${v.kicker}</div>` : ''}${v.icon ? `<div class="ricon">${v.icon}</div>` : ''}<h2>${v.title}</h2>${v.sub ? `<p class="sub">${v.sub}</p>` : ''}
      ${v.status ? `<p class="center hstat">${v.status}</p>` : ''}
      <div class="grid">${v.cands.map(c => `<button class="opt ${sel.includes(c.id) ? 'sel' : ''} ${v.locked || sent ? 'dis' : ''}" data-id="${c.id}">${esc(c.name)}${tags[c.id] ? `<span class="tag wtag">${esc(tags[c.id])}</span>` : ''}</button>`).join('')}</div>
      ${v.live ? '' : `<div class="acts">${v.skip ? `<button class="btn ghost" id="skip" ${sent ? 'disabled' : ''}>${v.skip}</button>` : ''}<button class="btn primary confirm" id="ok" ${sel.length === (v.n || 1) && !sent ? '' : 'disabled'}>${sent ? '…' : v.ok || 'Bestätigen'}</button></div>`}</div>`;
  }
  if (v.v === 'info') return `<div class="scr scene ${v.cls || ''}">${v.kicker ? `<div class="kicker">${v.kicker}</div>` : ''}${v.icon ? `<div class="big">${v.icon}</div>` : ''}<h2>${v.title}</h2>${v.html || ''}${v.rid ? `<div class="acts"><button class="btn primary" id="ok" ${sent ? 'disabled' : ''}>${v.btn || 'Weiter'}</button></div>` : ''}</div>`;
  if (v.v === 'choice') return `<div class="scr scene">${v.kicker ? `<div class="kicker">${v.kicker}</div>` : ''}${v.icon ? `<div class="big">${v.icon}</div>` : ''}<h2>${v.title}</h2>${v.html || ''}<div class="acts" style="flex-direction:column">${v.options.map((o, i) => `<button class="btn ${o.cls || ''}" data-i="${i}" ${sent ? 'disabled' : ''}>${o.label}</button>`).join('')}</div></div>`;
  if (v.v === 'text') { const d = CL.draft[v.rid] || '';
    return `<div class="scr scene lwv">${v.kicker ? `<div class="kicker">${v.kicker}</div>` : ''}${v.icon ? `<div class="big">${v.icon}</div>` : ''}<h2>${v.title}</h2>${v.sub ? `<p>${v.sub}</p>` : ''}
      <textarea id="lw" maxlength="${v.max || 40}" rows="2" placeholder="…" autocomplete="off" ${sent ? 'disabled' : ''}>${esc(d)}</textarea><div class="cnt" id="lwc">${d.length} / ${v.max || 40}</div>
      <div class="acts">${v.skip ? `<button class="btn ghost" id="skip" ${sent ? 'disabled' : ''}>${v.skip}</button>` : ''}<button class="btn blood" id="ok" ${sent ? 'disabled' : ''}>${sent ? '…' : v.ok || 'Senden'}</button></div></div>`; }
  if (v.v === 'wait') return `<div class="scr scene waitv"><div class="big">${v.icon || '🌙'}</div><h2>${v.title}</h2><p>${v.sub || ''}</p><div class="dots"><i></i><i></i><i></i></div></div>`;
  if (v.v === 'role') return `<div class="scr center"><div class="kicker">${esc(me.name)}</div><h2 style="color:var(--gold)">${v.title}</h2>${me.role ? roleCardMe(me) : ''}<div class="acts"><button class="btn primary" id="ok" disabled>${v.btn || 'Verstanden'}</button></div></div>`;
  if (v.v === 'discuss') { const s = CL.pub.stage || {}; const btn = v.ready ? '<div class="acts"><button class="btn" disabled>✅ Du bist bereit</button></div>' : `<div class="acts"><button class="btn blood" id="ok">✋ Bereit zur Abstimmung</button></div>`;
    return `<div class="scr scene">${s.kicker ? `<div class="kicker">${s.kicker}</div>` : ''}<h2>${s.title || ''}</h2>${s.sub ? `<p>${s.sub}</p>` : ''}${timerHTML(btn)}${s.html || ''}</div>`; }
  return '';
}
function roleCardMe(me) {
  const R = ROLES[me.role];
  return `<div class="flip" id="flip"><div class="in">
    <div class="face back">${LOGO}<div class="ht">Gedrückt halten</div><div class="small mute" style="margin-top:6px">Niemand sonst darf hinschauen</div></div>
    <div class="face front ${me.team}"><div class="ri">${R.i}</div><div class="rn">${R.n}</div><div class="tm ${me.team}">${TEAM[me.team]}</div><div class="rd">${R.d}</div>${me.extra ? `<div class="rx">${me.extra}</div>` : ''}</div></div></div>`;
}
function bindFlip(onFirst) {
  const f = $('#flip'); if (!f) return;
  const on = e => { e.preventDefault(); f.classList.add('show'); if (!f._s) { f._s = 1; vib(15); onFirst && onFirst(); } };
  const off = () => f.classList.remove('show');
  f.addEventListener('pointerdown', on); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => f.addEventListener(ev, off));
  f.addEventListener('contextmenu', e => e.preventDefault());
}
function ghostHTML(me) {
  if (!me || me.alive !== false) return '';
  if (BL()) return `<div class="card ghost"><h3>👻 Du bist ein Geist</h3><p class="small mute">Am Tag gilt: kein Wort, kein Grinsen! Aber in der Nacht darfst du spuken. Wen die meisten Geister heimsuchen, der bekommt bei der nächsten Abstimmung eine Stimme mehr gegen sich.</p></div>`;
  return `<div class="card ghost"><h3>👻 Du bist tot</h3><p class="small mute">Du darfst nichts mehr verraten – kein Wort, kein Grinsen!</p>
    ${me.ghost ? `<details><summary class="small" style="color:var(--gold)">Geisterblick: alle Rollen ansehen</summary><table class="tbl" style="margin-top:8px">${me.ghost.map(g => `<tr><td>${g.i}</td><td class="${g.a ? '' : 'strike'}">${esc(g.n)}${g.l ? ' 💘' : ''}</td><td class="small mute">${g.r}</td></tr>`).join('')}</table></details>` : ''}</div>`;
}
function endHTML(E) {
  return `<div class="win"><div class="hero"><div class="big" style="font-size:5rem">${E.icon}</div></div><h1>${E.title}</h1>
    <p class="center mute">Nach ${E.rounds} ${E.rounds === 1 ? 'Nacht' : 'Nächten'}${E.angel ? ` · ${esc(E.angel)} war der Engel` : ''}</p>
    <div class="card"><h3>🃏 Alle Rollen</h3><table class="tbl">${E.rows.map(p => `<tr><td>${p.i}</td><td><b class="${p.a ? '' : 'strike'}">${esc(p.n)}</b>${p.s ? ' ' + p.s : ''}${p.l ? ' 💘' : ''}${p.cap ? ' 🎖️' : ''}<div class="small mute">${p.r}</div></td><td class="small mute" style="text-align:right">${p.a ? '✅ lebt' : esc(p.c)}</td></tr>`).join('')}</table></div>
    <details class="card"><summary><h3>📜 Was wirklich geschah</h3></summary><div class="log">${E.log.map(l => `<div><b>${l.at}</b> · ${esc(l.t)}</div>`).join('')}</div></details>
    ${MP.host ? `<div class="acts" style="flex-direction:column"><button class="btn primary endagain" id="again">🔁 Neue Runde mit allen</button><button class="btn ghost" id="tolobby">Zur Lobby (Rollen ändern)</button></div>` : '<p class="center mute">Warte auf den Spielleiter für die nächste Runde…</p>'}</div>`;
}
function playerLobbyHTML(P) {
  return `<div class="hero">${LOGO}<h1 style="font-size:1.9rem">Du bist dabei!</h1><p>Raum ${esc(P.code || MP.code)}</p></div>
    ${P.var === 'blut' ? `<div class="card vbanner"><h3>🩸 Blutnacht</h3><p class="small">Heute spielt ihr die Horror-Variante: Mörder statt Werwölfe, Tatorte mit Spuren, geheime Zeichen, letzte Worte und spukende Tote.</p></div>` : ''}
    <div class="card"><h3>👥 Im Raum <span class="mute small" style="margin-left:auto">${(P.players || []).length}</span></h3>
      <div class="chips">${(P.players || []).map(p => `<span class="chip"><span class="cdot ${p.c ? 'on' : ''}"></span> ${esc(p.n)}${p.n === MP.name ? ' (du)' : ''}</span>`).join('')}</div></div>
    <div class="card small"><h3>🕯️ Bevor es losgeht</h3>
      <p>• Bildschirm-Helligkeit runter, Handy flach in der Hand – niemand darf mitlesen.</p>
      <p>• Nachts bekommt <b>jeder</b> gleichzeitig eine Aufgabe. Tipp ganz normal – alle tippen, deshalb fällt niemand auf.</p>
      <p>• Der Erzähler spricht über das Handy des Spielleiters.</p>
      <p class="center mute" style="margin-top:12px">Warte, bis der Spielleiter das Spiel startet…</p></div>
    <div class="acts"><button class="btn ghost" id="leave">Raum verlassen</button></div>`;
}
CL.render = (force) => {
  if (MP.err) { render(`<div class="scr scene"><div class="big">🚪</div><h2>Nicht möglich</h2><p>${esc(MP.err)}</p><div class="acts"><button class="btn primary" id="eback">Zum Start</button></div></div>`); $('#eback').onclick = () => { MP.err = null; mpLeave(); }; return; }
  if (MP.ended && !MP.host) { render(`<div class="scr scene"><div class="big">🌫️</div><h2>Der Raum wurde geschlossen</h2><p>Der Spielleiter hat das Spiel beendet.</p><div class="acts"><button class="btn primary" id="eback">Zum Start</button></div></div>`); $('#eback').onclick = mpLeave; return; }
  const P = CL.pub; if (!P) return;
  if (P.ph === 'lobby') {
    if (MP.host) return;
    const k = 'L' + (P.var || '') + JSON.stringify(P.players); if (k === CL.key && !force) return; CL.key = k;
    document.body.classList.remove('ingame');
    render(playerLobbyHTML(P)); $('#leave').onclick = () => { CL.send({t: 'bye'}); mpLeave(); }; return;
  }
  const me = CL.priv && CL.priv.me, v = CL.priv && CL.priv.view;
  if (P.ph === 'end' && P.end) {
    const k = 'E' + JSON.stringify(P.end.rows) + P.end.title; if (k === CL.key && !force) return; CL.key = k;
    document.body.classList.remove('ingame');
    render(endHTML(P.end));
    if (MP.host) { $('#again').onclick = () => mpStartGame(); $('#tolobby').onclick = () => { MP.players.forEach(p => { p.role = null; p.alive = true; p.view = null; p.pending = null; }); G = null; MP.pub = {ph: 'lobby', code: MP.code}; A.scene('none'); hostLobby(); }; }
    return;
  }
  const key = JSON.stringify([P.stage, v, me && me.alive, me && me.extra, me && !!me.ghost, P.ready, CL.sent[v && v.rid]]);
  if (key === CL.key && !force) return; CL.key = key;
  const body = v ? viewHTML(v, me || {}) : stageHTML(P.stage);
  render(body + (v && v.v !== 'role' ? '' : ghostHTML(me)) + (!v ? '' : ''));
  // Bindings
  if (!v) { tickTimer(); return; }
  const rid = v.rid;
  const ans = val => { if (CL.sent[rid]) return; CL.sent[rid] = true; CL.send({t: 'ans', rid, val}); CL.render(true); };
  if (v.v === 'pick') {
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (v.locked || CL.sent[rid]) return;
      const id = +b.dataset.id; let sel = CL.sel[rid] || [];
      if (sel.includes(id) && !v.live) sel = sel.filter(x => x !== id); else { if ((v.n || 1) === 1) sel = []; if (sel.length < (v.n || 1)) sel.push(id); }
      CL.sel[rid] = sel; vib(8);
      app.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', sel.includes(+o.dataset.id)));
      if (v.live) CL.send({t: 'sel', rid, val: id});
      const ok = $('#ok'); if (ok) ok.disabled = sel.length !== (v.n || 1);
    });
    if ($('#ok')) $('#ok').onclick = () => { const s = CL.sel[rid] || []; ans((v.n || 1) === 1 ? s[0] : s); };
    if ($('#skip')) $('#skip').onclick = () => ans(null);
  } else if (v.v === 'info' && rid) $('#ok').onclick = () => ans(true);
  else if (v.v === 'choice') app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => ans(v.options[+b.dataset.i].value));
  else if (v.v === 'text') {
    const ta = $('#lw'), cnt = $('#lwc');
    if (ta) ta.oninput = () => { CL.draft[rid] = ta.value; if (cnt) cnt.textContent = ta.value.length + ' / ' + (v.max || 40); };
    if ($('#ok')) $('#ok').onclick = () => ans(ta ? ta.value : '');
    if ($('#skip')) $('#skip').onclick = () => ans('');
  }
  else if (v.v === 'role') { bindFlip(() => { const ok = $('#ok'); if (ok) ok.disabled = false; }); $('#ok').onclick = () => ans(true); }
  else if (v.v === 'discuss' && rid && $('#ok')) $('#ok').onclick = () => ans(true);
  tickTimer();
};

/* ---------- Menü im Mehrspieler-Modus ---------- */
function mpMenu() {
  const me = CL.priv && CL.priv.me, P = CL.pub || {};
  const waiting = MP.host ? MP.players.filter(p => p.pending).length : 0;
  openOv(`<div class="hero">${LOGO}<h1 style="font-size:1.6rem">Menü</h1><p>Raum ${esc(MP.code)} <span class="cdot ${MP.netOk ? 'on' : ''}" id="mpnet"></span></p></div>
    <div class="acts" style="flex-direction:column">
      ${me && me.role ? '<button class="btn" id="m_role">🃏 Meine Rolle ansehen</button>' : ''}
      ${MP.host ? `
        ${MP.discuss ? '<button class="btn blood" id="m_vote">⚖️ Abstimmung jetzt starten</button><button class="btn" id="m_add">⏳ +1 Minute Diskussion</button>' : ''}
        ${waiting || (MP.hunt && !MP.hunt.done) ? `<button class="btn" id="m_skip">⏩ Nicht mehr warten (${waiting} offen)</button><p class="small mute center" style="margin:-4px 0 4px">Nur nutzen, wenn jemand nicht mehr reagiert. Für ihn wird zufällig gewählt.</p>` : ''}
        <button class="btn" id="m_snd">${S.soundOn ? '🔊 Atmosphäre an' : '🔇 Atmosphäre aus'}</button>
        <button class="btn" id="m_voice">${S.voiceOn ? '🗣️ Erzählerstimme an' : '🤐 Erzählerstimme aus'}</button>
        <div class="card small"><b>Verbindungen</b><div class="chips">${MP.players.map(p => `<span class="chip"><span class="cdot ${p.conn ? 'on' : ''}"></span> ${esc(p.name)}</span>`).join('')}</div></div>
        ${!S.mpPlay && G ? `<details class="card small"><summary><b>👁️ Spielleiter-Sicht: alle Rollen</b></summary><table class="tbl">${G.players.map(p => `<tr><td>${ROLES[p.role].i}</td><td class="${p.alive ? '' : 'strike'}">${esc(p.name)}</td><td class="mute">${roleName(p)}</td></tr>`).join('')}</table></details>` : ''}
        <button class="btn blood" id="m_quit">Spiel beenden</button>` : '<button class="btn blood" id="m_leave">Spiel verlassen</button>'}
      <button class="btn" id="m_rules">📖 Regeln & Rollen</button>
      <button class="btn primary" id="m_close">Zurück zum Spiel</button></div>`);
  const b = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  b('#m_close', closeOv);
  b('#m_rules', () => rulesOv(true));
  b('#m_role', () => {
    openOv(`<div class="center"><div class="kicker">${esc(me.name)}</div><h2 style="color:var(--gold)">Deine Rolle</h2>${roleCardMe(me)}<div class="acts"><button class="btn primary" id="done">Fertig</button></div></div>`);
    const f = ovc.querySelector('#flip'); const on = e => { e.preventDefault(); f.classList.add('show'); }, off = () => f.classList.remove('show');
    f.addEventListener('pointerdown', on); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => f.addEventListener(ev, off));
    $('#done').onclick = closeOv;
  });
  b('#m_vote', () => { MP.discuss && MP.discuss.skip(); closeOv(); });
  b('#m_add', () => { MP.discuss && MP.discuss.add(); closeOv(); });
  b('#m_skip', () => { if (MP.hunt && !MP.hunt.done) MP.hunt.force(); MP.players.forEach(autoAnswer); closeOv(); });
  b('#m_snd', () => { S.soundOn = !S.soundOn; saveS(); A.volume(); mpMenu(); });
  b('#m_voice', () => { S.voiceOn = !S.voiceOn; saveS(); if (!S.voiceOn) try { speechSynthesis.cancel(); } catch (e) {} mpMenu(); });
  b('#m_quit', () => { if (confirm('Spiel für alle beenden?')) { closeOv(); try { speechSynthesis.cancel(); } catch (e) {} G.winner = G.winner || 'none'; mpLeave(); } });
  b('#m_leave', () => { if (confirm('Spiel verlassen? Du kannst mit deinem Namen wieder beitreten.')) { CL.send({t: 'bye'}); mpLeave(); } });
}

/* ---------- Sterne & Start ---------- */
(function stars() { const s = $('#stars'); let h = ''; for (let i = 0; i < 90; i++) h += `<i class="star" style="left:${rnd(0, 100)}%;top:${rnd(0, 70)}%;animation-delay:${rnd(0, 4)}s;opacity:${rnd(.2, .9)};transform:scale(${rnd(.5, 1.4)})"></i>`; s.innerHTML = h; })();
(function route() {
  const m = location.hash.match(/r=([A-Z0-9]{5})(?:\.(\d))?/i);
  if (m) mpJoinScreen(m[1].toUpperCase(), m[2] != null ? +m[2] : null); else home();
})();
if ('serviceWorker' in navigator && !TEST && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('pointerdown', () => { A.resume(); }, {passive: true});
</script>
</body>
</html>
