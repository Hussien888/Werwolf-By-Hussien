<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Werwolf – Düsterwald</title>
<meta name="description" content="Digitaler Spielleiter für Werwolf: Rollen verteilen, mystischer Erzähler, geheime Abstimmungen.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Werwolf">
<meta name="theme-color" content="#07060d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Creepster&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060d; --bg2:#140f22; --ink:#efe6d2; --mute:#a59cb4; --gold:#f1d68a; --gold2:#c99a45;
  --blood:#c0283f; --blood2:#7a1222; --violet:#7b5bb5; --green:#5fae7b;
  --card:rgba(22,17,36,.78); --line:rgba(241,214,138,.16); --line2:rgba(241,214,138,.35);
  --r:18px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Spectral,Georgia,serif;font-size:17px;line-height:1.45;overflow-x:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background 2.5s}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;letter-spacing:.02em;margin:.2em 0}
button{font:inherit;color:inherit}

/* ---------- Himmel ---------- */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,#2a1f3d 0%,#120d1f 45%,#07060d 100%);transition:opacity 2.5s}
#dayg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 3s;
  background:radial-gradient(ellipse at 50% 110%,#e08a4a 0%,#7a3d4a 30%,#2c2140 65%,#120d1f 100%)}
body.day #dayg{opacity:1}
#stars{position:absolute;inset:0;transition:opacity 3s}
body.day #stars{opacity:.15}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#moon{position:absolute;right:-60px;top:calc(40px + var(--sat));width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#fff6d6,#f1d68a 60%,#c99a45);
  box-shadow:0 0 60px 20px rgba(241,214,138,.22),0 0 160px 60px rgba(241,214,138,.08);opacity:.55;transition:all 3s}
body.day #moon{top:110%;opacity:0}
body.ingame #moon{width:150px;height:150px;right:-70px;opacity:.28}
.fog{position:absolute;left:-50%;width:200%;height:45%;bottom:-8%;opacity:.35;filter:blur(30px);
  background:radial-gradient(ellipse at 20% 60%,rgba(170,160,200,.35),transparent 55%),radial-gradient(ellipse at 70% 50%,rgba(150,140,190,.3),transparent 50%);
  animation:drift 38s linear infinite}
.fog.f2{bottom:-15%;opacity:.25;animation-duration:55s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(25%)}}
#trees{position:absolute;left:0;right:0;bottom:0;height:120px;opacity:.9}
body.blood #sky{background:radial-gradient(ellipse at 50% 0%,#4a1020 0%,#1a0810 50%,#07060d 100%)}

/* ---------- Layout ---------- */
#app{position:relative;z-index:1;min-height:100%;padding:calc(14px + var(--sat)) 16px calc(110px + var(--sab));max-width:640px;margin:0 auto}
.fade{animation:fin .45s ease}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card h3{font-size:1.05rem;color:var(--gold);display:flex;align-items:center;gap:8px}
.mute{color:var(--mute)}
.small{font-size:.88rem}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}

.hero{text-align:center;padding:14px 0 4px}
.hero svg{width:118px;height:118px;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 0 1px var(--line2)}
.hero h1{font-family:"Cinzel Decorative",Cinzel,serif;font-size:2.4rem;margin:.25em 0 0;color:var(--gold);text-shadow:0 0 24px rgba(241,214,138,.35)}
.hero p{margin:.1em 0 0;color:var(--mute);font-style:italic}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:rgba(255,255,255,.04);
  border-radius:14px;padding:14px 18px;font-family:Cinzel,serif;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .1s,background .2s,opacity .2s;min-height:52px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#f3dc98,#c99a45);color:#1a1206;border-color:transparent;box-shadow:0 6px 24px rgba(201,154,69,.3)}
.btn.blood{background:linear-gradient(180deg,#d63a52,#8e1528);border-color:transparent;color:#fff;box-shadow:0 6px 24px rgba(192,40,63,.35)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:7px 12px;font-size:.85rem;border-radius:10px}
.acts{display:flex;gap:10px;margin-top:18px}
.acts .btn{flex:1}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + var(--sab));
  background:linear-gradient(180deg,transparent,rgba(7,6,13,.92) 35%)}
.sticky .in{max-width:640px;margin:0 auto}

input[type=text]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit;font-size:16px;outline:none}
input[type=text]:focus{border-color:var(--gold2)}
select{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--ink);font:inherit;font-size:15px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--gold2)}

.plist{list-style:none;padding:0;margin:10px 0 0;counter-reset:p}
.plist li{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.05);counter-increment:p}
.plist li:before{content:counter(p);width:22px;color:var(--mute);font-size:.8rem;text-align:right}
.plist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:1px solid var(--line);background:transparent;border-radius:9px;width:34px;height:34px;cursor:pointer;color:var(--mute);font-size:1rem}
.ib:active{background:rgba(255,255,255,.08)}

.roles{display:grid;gap:8px;margin-top:10px}
.role{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.2);cursor:pointer;transition:all .2s}
.role.on{border-color:var(--gold2);background:rgba(241,214,138,.08)}
.role .ic{font-size:1.7rem;width:38px;text-align:center}
.role b{font-family:Cinzel,serif;font-size:.95rem}
.role .d{font-size:.83rem;color:var(--mute);line-height:1.3}
.sw{margin-left:auto;flex:none;width:46px;height:28px;border-radius:20px;background:#3a3448;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfc6dc;transition:.2s}
.on>.sw,.sw.on{background:var(--gold2)}
.on>.sw:after,.sw.on:after{left:21px;background:#fff}
.tgroup{font-family:Cinzel,serif;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:14px 2px 2px}
.counter{display:flex;align-items:center;gap:10px}
.counter b{min-width:28px;text-align:center;font-size:1.3rem;font-family:Cinzel,serif}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:30px;padding:3px 10px;font-size:.85rem;background:rgba(0,0,0,.25)}
.warn{color:#ff8a9a;font-size:.9rem;margin-top:8px}
.set{display:grid;gap:14px}
.set label{display:block;font-size:.92rem;color:var(--mute);margin-bottom:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:10px 6px;cursor:pointer;font-size:.9rem}
.seg button.on{background:rgba(241,214,138,.16);color:var(--gold)}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary h3:after{content:"▾";margin-left:auto;color:var(--mute)}
details[open] summary h3:after{content:"▴"}

/* ---------- Spielszenen ---------- */
.scr{min-height:calc(100vh - 160px);min-height:calc(100dvh - 160px);display:flex;flex-direction:column;justify-content:center}
.scene{text-align:center}
.scene .big{font-size:5rem;line-height:1;filter:drop-shadow(0 0 30px rgba(241,214,138,.35));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.scene h2{font-size:1.9rem;color:var(--gold);margin-top:14px}
.scene p{color:var(--mute);font-style:italic}
.kicker{font-family:Cinzel,serif;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.scene .kicker+.big{margin-top:14px}
.ricon{font-size:3.6rem;text-align:center;filter:drop-shadow(0 0 22px rgba(241,214,138,.3))}
.pick h2{text-align:center;color:var(--gold);font-size:1.5rem}
.pick .sub{text-align:center;color:var(--mute);margin:.2em 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;border:1px solid var(--line);background:rgba(0,0,0,.3);border-radius:14px;padding:16px 10px;min-height:62px;cursor:pointer;
  font-family:Cinzel,serif;font-weight:700;font-size:1rem;transition:all .15s;word-break:break-word}
.opt.sel{border-color:var(--gold);background:rgba(241,214,138,.18);box-shadow:0 0 0 2px rgba(241,214,138,.35),0 0 26px rgba(241,214,138,.2)}
.pick.wolf .opt.sel{border-color:var(--blood);background:rgba(192,40,63,.25);box-shadow:0 0 0 2px rgba(192,40,63,.5),0 0 26px rgba(192,40,63,.3)}
.opt .tag{position:absolute;top:4px;right:7px;font-size:.85rem}
.opt.dis{opacity:.3;pointer-events:none}
.pass{text-align:center}
.pass .to{font-size:.95rem;color:var(--mute);font-family:Cinzel,serif;letter-spacing:.15em;text-transform:uppercase}
.pass .who{font-family:"Cinzel Decorative",Cinzel,serif;font-size:2.6rem;color:var(--gold);margin:10px 0 6px;word-break:break-word}
.pass .hint{color:var(--mute);font-style:italic;margin-bottom:24px}
.prog{display:flex;gap:4px;justify-content:center;margin:0 0 22px;flex-wrap:wrap}
.prog i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15)}
.prog i.d{background:var(--gold2)}

/* Rollenkarte */
.flip{perspective:1200px;margin:6px auto 0;width:min(320px,86vw);height:min(440px,62vh);touch-action:none;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.show .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:hidden}
.face.back{background:radial-gradient(circle at 50% 35%,#2d2245,#120d1f 70%);border:2px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.face.back svg{width:62%;height:auto;border-radius:24px;opacity:.95}
.face.back .ht{margin-top:18px;font-family:Cinzel,serif;color:var(--gold);letter-spacing:.06em}
.face.front{transform:rotateY(180deg);background:linear-gradient(180deg,#1f1830,#0e0a17);border:2px solid var(--gold2);box-shadow:0 0 50px rgba(241,214,138,.25)}
.face.front.wolf{border-color:var(--blood);box-shadow:0 0 50px rgba(192,40,63,.4);background:linear-gradient(180deg,#2a0f18,#0e0a17)}
.face.front.solo{border-color:var(--violet);box-shadow:0 0 50px rgba(123,91,181,.4)}
.face .ri{font-size:5rem;line-height:1.1}
.face .rn{font-family:"Cinzel Decorative",Cinzel,serif;font-size:1.7rem;color:var(--gold);margin:6px 0 2px}
.face .tm{font-family:Cinzel,serif;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid currentColor;margin-bottom:12px}
.tm.dorf{color:var(--green)} .tm.wolf{color:#ff6b80} .tm.solo{color:#b99be8}
.face .rd{font-size:.98rem;line-height:1.4}
.face .rx{margin-top:12px;font-size:.9rem;color:var(--gold);font-style:italic}

/* Untertitel */
#cap{position:fixed;left:50%;bottom:calc(16px + var(--sab));transform:translateX(-50%);z-index:8;width:min(600px,calc(100% - 28px));
  background:rgba(7,6,13,.82);border:1px solid var(--line);border-radius:16px;padding:12px 16px 12px 44px;font-style:italic;font-size:1.02rem;
  color:#f4ead2;opacity:0;pointer-events:none;transition:opacity .35s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#cap.on{opacity:1;pointer-events:auto}
#cap:before{content:"🕯️";position:absolute;left:14px;top:11px;font-style:normal;animation:flick 1.6s infinite}
#cap small{display:block;font-style:normal;color:var(--mute);font-size:.72rem;margin-top:4px;font-family:Cinzel,serif;letter-spacing:.08em}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.6}55%{opacity:.9}}
body.ingame .sticky{bottom:0}
body.capon .sticky{transform:translateY(-78px);transition:transform .3s}

/* Menü */
#menuBtn{position:fixed;top:calc(10px + var(--sat));right:12px;z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(7,6,13,.6);font-size:1.2rem;cursor:pointer;display:none;backdrop-filter:blur(6px)}
body.ingame #menuBtn{display:block}
#ov{position:fixed;inset:0;z-index:20;display:none;background:rgba(4,3,8,.92);overflow:auto;padding:calc(18px + var(--sat)) 16px calc(24px + var(--sab))}
#ov.on{display:block}
#ov .wrap{max-width:600px;margin:0 auto}

/* Tod */
.dead .big{filter:grayscale(.2) drop-shadow(0 0 30px rgba(192,40,63,.5))}
.tomb{margin:18px auto 0;max-width:340px;border:1px solid var(--line);border-radius:18px;padding:16px;background:rgba(0,0,0,.35)}
.tomb .rn{font-family:Cinzel,serif;font-size:1.3rem;color:var(--gold)}
.strike{text-decoration:line-through;opacity:.5}

/* Timer */
.timer{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:12px auto}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:3.2rem;color:var(--gold)}
.timer.low .t{color:#ff6b80;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* Ergebnis */
.bars{display:grid;gap:8px;margin-top:12px}
.bar{position:relative;isolation:isolate;border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow:hidden;display:flex;justify-content:space-between;font-family:Cinzel,serif}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(192,40,63,.55),rgba(192,40,63,.15));transition:width 1.2s ease;z-index:-1}
.bar.top{border-color:var(--blood)}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.vrow .nm{flex:1;font-family:Cinzel,serif}
.vrow b{min-width:26px;text-align:center;font-size:1.2rem}

/* Ende */
.win h1{font-family:"Cinzel Decorative",Cinzel,serif;font-size:2.1rem;color:var(--gold);text-align:center;margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.log{font-size:.9rem;line-height:1.5}
.log div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.log b{color:var(--gold);font-family:Cinzel,serif;font-weight:500}
.confetti{position:fixed;top:-20px;font-size:1.4rem;z-index:30;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.flash{position:fixed;inset:0;z-index:25;pointer-events:none;background:radial-gradient(circle,rgba(192,40,63,.5),transparent 70%);animation:fl 1.4s ease forwards}
@keyframes fl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.foot{text-align:center;color:var(--mute);font-size:.8rem;margin-top:22px}
a{color:var(--gold)}
@media (min-width:520px){.grid{grid-template-columns:1fr 1fr 1fr}}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6b3340;vertical-align:middle;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.cdot.on{background:#5fae7b;box-shadow:0 0 8px rgba(95,174,123,.7)}
.plist li .cdot{flex:none}
.roomcode{display:flex;justify-content:center;gap:8px;margin:10px 0 14px}
.roomcode span{font-family:"Cinzel Decorative",Cinzel,serif;font-size:2.1rem;color:var(--gold);width:48px;height:60px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:12px;background:rgba(0,0,0,.35)}
.qr{width:200px;margin:0 auto 10px;border-radius:14px;overflow:hidden;box-shadow:0 0 30px rgba(241,214,138,.2)}
.qr svg{display:block;width:100%;height:auto}
.hstat{color:var(--gold);margin:-4px 0 12px;font-size:.95rem}
.opt .wtag{position:absolute;left:6px;right:6px;bottom:3px;top:auto;font-family:Spectral,serif;font-weight:400;font-size:.72rem;color:#ff8a9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.wolf .opt{padding-bottom:22px}
.whisper{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;text-align:left}
.whisper>div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(0,0,0,.3)}
.wrow{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.vlist{margin-top:14px;text-align:left;font-size:.9rem;columns:2;column-gap:16px}
.vlist div{break-inside:avoid;padding:2px 0}
.waitv .big{animation:float 5s ease-in-out infinite,dim 3s ease-in-out infinite}
@keyframes dim{50%{opacity:.6}}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--gold2);animation:dt 1.4s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,80%,100%{opacity:.2}40%{opacity:1}}
#lostbar{position:fixed;top:calc(8px + var(--sat));left:12px;right:64px;z-index:15;background:rgba(122,18,34,.92);color:#fff;border-radius:12px;padding:9px 12px;font-size:.85rem;text-align:center}
.card.ghost{border-color:rgba(185,155,232,.35);background:rgba(40,30,60,.6);margin-top:-10px}

/* ---------- Spielvariante „Blutnacht“ ---------- */
body.blut{--gold:#efb9a8;--gold2:#b8443f;--line:rgba(230,110,110,.16);--line2:rgba(230,110,110,.36);--violet:#8a3550;--card:rgba(30,12,18,.8)}
body.blut #sky{background:radial-gradient(ellipse at 50% 0%,#3f0d17 0%,#1a070c 48%,#060407 100%)}
body.blut #moon{background:radial-gradient(circle at 40% 38%,#ffd2c2,#d2483f 58%,#6e1018);box-shadow:0 0 60px 20px rgba(210,60,60,.25),0 0 160px 60px rgba(210,60,60,.1);opacity:.62}
body.blut .fog{background:radial-gradient(ellipse at 20% 60%,rgba(200,140,150,.3),transparent 55%),radial-gradient(ellipse at 70% 50%,rgba(170,110,130,.28),transparent 50%)}
body.blut #dayg{background:radial-gradient(ellipse at 50% 110%,#9a5a52 0%,#5a2a32 30%,#26141c 65%,#120a10 100%)}
body.blut .hero svg,body.blut .face.back svg,body.blut .scene .big svg{filter:hue-rotate(-38deg) saturate(1.9) brightness(.92)}
body.blut .hero h1{text-shadow:0 0 24px rgba(220,70,70,.45)}

const A = {
  ctx: null, master: null, amb: null, sfx: null, verb: null, layers: {}, scn: 'none', timers: [],
  init() {
    if (this.ctx || TEST) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext; this.ctx = new C();
      const c = this.ctx;
      this.master = c.createGain(); this.master.gain.value = S.soundOn ? S.vol : 0; this.master.connect(c.destination);
      this.amb = c.createGain(); this.amb.gain.value = 1; this.amb.connect(this.master);
      this.sfx = c.createGain(); this.sfx.gain.value = 1; this.sfx.connect(this.master);
      // Hall
      const len = c.sampleRate * 3.2, ir = c.createBuffer(2, len, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
      this.verb = c.createConvolver(); this.verb.buffer = ir;
      const vg = c.createGain(); vg.gain.value = .55; this.verb.connect(vg); vg.connect(this.master);
      // Rauschen
      const nb = c.createBuffer(1, c.sampleRate * 3, c.sampleRate), nd = nb.getChannelData(0);
      let last = 0; for (let i = 0; i < nd.length; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; nd[i] = last * 3.5; }
      this.noise = nb;
      this.buildNight(); this.buildDay();
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume(); },
  volume() { if (this.master) this.master.gain.setTargetAtTime(S.soundOn ? S.vol : 0, this.ctx.currentTime, .2); },
  lfo(freq, depth, target, type = 'sine') {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = freq; g.gain.value = depth; o.connect(g); g.connect(target); o.start(); return o;
  },
  buildNight() {
    const c = this.ctx, bus = c.createGain(); bus.gain.value = 0; bus.connect(this.amb);
    // Wind: zwei Schichten gefiltertes Rauschen
    [[380, .07, .5], [900, .045, .22]].forEach(([f, sp, vol]) => {
      const s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = .8;
      const g = c.createGain(); g.gain.value = vol;
      this.lfo(sp, f * .6, bp.frequency); this.lfo(sp * 1.3, vol * .7, g.gain);
      s.connect(bp); bp.connect(g); g.connect(bus); s.start();
    });

    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.connect(bus);
    const dg = c.createGain(); dg.gain.value = .09; dg.connect(lp); this.lfo(.05, .05, dg.gain);
    [[55, 'sawtooth'], [55.35, 'sawtooth'], [82.4, 'triangle'], [41.2, 'sine']].forEach(([f, t]) => { const o = c.createOscillator(); o.type = t; o.frequency.value = f; o.connect(dg); o.start(); });
    this.layers.night = bus;
  },
  buildDay() {
    const c = this.ctx, bus = c.createGain(); bus.gain.value = 0; bus.connect(this.amb);
    const s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = .5;
    const g = c.createGain(); g.gain.value = .12; s.connect(bp); bp.connect(g); g.connect(bus); s.start();
    const pad = c.createGain(); pad.gain.value = .025; pad.connect(bus);
    [196, 246.9, 293.7].forEach(f => { const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(pad); o.start(); });
    this.lfo(.08, .015, pad.gain);
    this.layers.day = bus;
  },
  scene(name) {
    if (!this.ctx) return; this.scn = name; const t = this.ctx.currentTime;
    for (const k in this.layers) this.layers[k].gain.setTargetAtTime(k === name ? 1 : 0, t, 1.2);
    this.timers.forEach(clearTimeout); this.timers = [];
    const loop = (fn, a, b) => { const go = () => { fn(); this.timers.push(setTimeout(go, rnd(a, b))); }; this.timers.push(setTimeout(go, rnd(a * .4, b * .5))); };
    if (name === 'night' && BL()) { loop(() => this.creak(), 15000, 30000); loop(() => this.whisper(.25), 26000, 50000); loop(() => this.musicbox(.18), 50000, 90000); loop(() => this.owl(), 30000, 60000); }
    else if (name === 'night') { loop(() => this.owl(), 18000, 40000); loop(() => this.howl(.35), 35000, 70000); loop(() => this.creak(), 25000, 50000); }
    if (name === 'day') { loop(() => this.bird(), 2500, 7000); }
  },
  duck(on) { if (this.amb) this.amb.gain.setTargetAtTime(on ? .38 : 1, this.ctx.currentTime, .25); },
  env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },

  howl(vol = .6, base = 300) {

      const vib = c.createOscillator(), vg = c.createGain(); vib.frequency.value = 5.5; vg.gain.value = 7; vib.connect(vg); vg.connect(o.frequency); vib.start(s); vib.stop(s + dur);
      g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(vol * amp * .5, s + .6); g.gain.setValueAtTime(vol * amp * .5, s + 2.3); g.gain.exponentialRampToValueAtTime(.0001, s + dur);

  bell(n = 3, f0 = 196) {

  },
  beat(n = 2) {
    if (!this.ctx) return; const c = this.ctx;

  },

const V = {
  list() { try { return speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang)); } catch (e) { return []; } },
  best() {
    const vs = this.list(); if (!vs.length) return null;
    if (S.voiceURI) { const v = vs.find(v => v.voiceURI === S.voiceURI); if (v) return v; }
    const sc = v => { const n = v.name.toLowerCase(); let s = 0;
      if (/premium|erweitert|enhanced|natural|neural/.test(n)) s += 10;
      if (/online/.test(n)) s += 3;
      if (/martin|markus|yannick|viktor|conrad|killian|florian|stefan|male/.test(n)) s += 4;
      if (/google/.test(n)) s += 2; if (/de-de|deutschland/i.test(v.lang + n)) s += 1; return s; };
    return vs.slice().sort((a, b) => sc(b) - sc(a))[0];
  },
  chain: Promise.resolve(), skip: false
};
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = () => { if (window.onVoices) window.onVoices(); }; }

function caption(t, sub) {
  if (typeof MP !== 'undefined' && MP.host && MP.pub && MP.pub.ph && MP.pub.ph !== 'lobby') { MP.pub.cap = t || ''; sendPub(); }
  const c = $('#cap');
  if (!t) { c.classList.remove('on'); document.body.classList.remove('capon'); return; }
  c.innerHTML = esc(t) + '<small>Tippen zum Überspringen</small>'; c.classList.add('on'); document.body.classList.add('capon');
}
$('#cap').addEventListener('click', () => { V.skip = true; try { speechSynthesis.cancel(); } catch (e) {} });

function speakSeg(s) {
  return new Promise(res => {
    if (TEST) return res();
    const est = 900 + s.length * 68 / S.rate;
    let done = false, t;
    const fin = () => { if (!done) { done = true; clearTimeout(t); clearInterval(sk); res(); } };
    const sk = setInterval(() => { if (V.skip) fin(); }, 100);
    if (!S.voiceOn || !('speechSynthesis' in window)) { t = setTimeout(fin, est * .85); return; }
    const u = new SpeechSynthesisUtterance(s.replace(/…/g, '... '));
    u.lang = 'de-DE'; const v = V.best(); if (v) u.voice = v; u.pitch = S.pitch; u.rate = S.rate; u.volume = 1;
    u.onend = fin; u.onerror = fin; t = setTimeout(fin, est * 2.2 + 3000);
    try { speechSynthesis.speak(u); } catch (e) { fin(); }
  });
}
async function speakNow(text) {
  const segs = text.split('|').map(s => s.trim()).filter(Boolean);
  V.skip = false; A.duck(true);
  for (const s of segs) { if (V.skip) break; caption(s); await speakSeg(s); if (!V.skip) await sleep(380); }
  caption(''); A.duck(false); V.skip = false;
}
function say(text) { const p = V.chain.then(() => speakNow(text)); V.chain = p.catch(() => {}); return p; }

const line = (k, v = {}) => any((BL() && NB[k]) || N[k]).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');

/* =========================================================
   UI-Grundbausteine (alle geben Promises zurück)
   ========================================================= */
const app = $('#app');
function render(html) { app.innerHTML = '<div class="fade">' + html + '</div>'; window.scrollTo(0, 0); }
function sceneScr(icon, title, sub = '', kicker = '') {
  render(`<div class="scr scene">${kicker ? `<div class="kicker">${kicker}</div>` : ''}<div class="big">${icon}</div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>`);
}
function info({icon = '', kicker = '', title = '', html = '', btn = 'Weiter', delay = 0, cls = '', btnCls = 'primary'}) {
  return new Promise(res => {
    render(`<div class="scr scene ${cls}">${kicker ? `<div class="kicker">${kicker}</div>` : ''}${icon ? `<div class="big">${icon}</div>` : ''}<h2>${title}</h2>${html}
      <div class="acts"><button class="btn ${btnCls}" id="ok" ${delay && !TEST ? 'disabled' : ''}>${btn}</button></div></div>`);
    const b = $('#ok'); if (delay && !TEST) setTimeout(() => b.disabled = false, delay);
    b.onclick = () => res();
  });
}
function choice({icon = '', kicker = '', title, html = '', options}) {
  return new Promise(res => {
    render(`<div class="scr scene">${kicker ? `<div class="kicker">${kicker}</div>` : ''}${icon ? `<div class="big">${icon}</div>` : ''}<h2>${title}</h2>${html}
      <div class="acts" style="flex-direction:column">${options.map((o, i) => `<button class="btn ${o.cls || ''}" data-i="${i}">${o.label}</button>`).join('')}</div></div>`);
    app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => res(options[+b.dataset.i].value));
  });
}
/* Spielerauswahl: n = Anzahl, skip = Text für "niemand" */
function pick({icon = '', kicker = '', title, sub = '', cands, n = 1, skip = null, ok = 'Bestätigen', tag = null, cls = '', extra = ''}) {
  return new Promise(res => {
    let sel = [];
    render(`<div class="scr pick ${cls}">${kicker ? `<div class="kicker center">${kicker}</div>` : ''}${icon ? `<div class="ricon">${icon}</div>` : ''}<h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}
      <div class="grid">${cands.map(p => `<button class="opt" data-id="${p.id}">${esc(p.name)}${tag && tag(p) ? `<span class="tag">${tag(p)}</span>` : ''}</button>`).join('')}</div>${extra}
      <div class="acts">${skip ? `<button class="btn ghost" id="skip">${skip}</button>` : ''}<button class="btn primary confirm" id="ok" disabled>${ok}</button></div></div>`);
    const okB = $('#ok');
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const id = +b.dataset.id;
      if (sel.includes(id)) sel = sel.filter(x => x !== id); else { if (n === 1) sel = []; if (sel.length < n) sel.push(id); }
      app.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', sel.includes(+o.dataset.id)));
      okB.disabled = sel.length !== n; vib(8);
    });
    okB.onclick = () => res(n === 1 ? sel[0] : sel);
    if (skip) $('#skip').onclick = () => res(null);
  });
}
/* Handy an jemanden weitergeben */
function passTo(p, {hint = 'Nur diese Person schaut aufs Handy.', btn = null, step = null} = {}) {
  return new Promise(res => {
    const prog = step ? `<div class="prog">${Array.from({length: step[1]}, (_, i) => `<i class="${i < step[0] ? 'd' : ''}"></i>`).join('')}</div>` : '';
    render(`<div class="scr pass">${prog}<div class="to">Gib das Handy an</div><div class="who">${esc(p.name)}</div><div class="hint">${hint}</div>
      <button class="btn primary wide" id="ok">${btn || 'Ich bin ' + esc(p.name)}</button></div>`);
    $('#ok').onclick = () => { vib(10); res(); };
  });
}
/* Rollenkarte zum Gedrückthalten */
function roleCard(p, extraTxt = '') {
  const R = ROLES[p.role]; const t = isWolf(p) && p.role === 'wildeskind' ? 'wolf' : R.t;
  return `<div class="flip" id="flip"><div class="in">
    <div class="face back">${LOGO}<div class="ht">Gedrückt halten</div><div class="small mute" style="margin-top:6px">Niemand sonst darf hinschauen</div></div>
    <div class="face front ${t}"><div class="ri">${R.i}</div><div class="rn">${R.n}</div><div class="tm ${t}">${TEAM[t]}</div><div class="rd">${R.d}</div>${extraTxt ? `<div class="rx">${extraTxt}</div>` : ''}</div>
  </div></div>`;
}
function holdReveal(p, title, extraTxt, btn = 'Verstanden – weitergeben') {
  return new Promise(res => {
    render(`<div class="scr center"><div class="kicker">${esc(p.name)}</div><h2 style="color:var(--gold)">${title}</h2>${roleCard(p, extraTxt)}
      <div class="acts"><button class="btn primary" id="ok" disabled>${btn}</button></div></div>`);
    const f = $('#flip'), ok = $('#ok');
    const on = e => { e.preventDefault(); f.classList.add('show'); ok.disabled = false; if (!f._s) { f._s = 1; A.whoosh(); vib(15); } };
    const off = () => f.classList.remove('show');
    f.addEventListener('pointerdown', on); f.addEventListener('pointerup', off); f.addEventListener('pointerleave', off); f.addEventListener('pointercancel', off);
    f.addEventListener('contextmenu', e => e.preventDefault());
    ok.onclick = () => { off(); res(); };
  });
}
function flash(cls = '') { const d = document.createElement('div'); d.className = 'flash'; document.body.appendChild(d); setTimeout(() => d.remove(), 1500); }

/* =========================================================
   SPIEL
   ========================================================= */
let G = null;
const byId = id => G.players.find(p => p.id === id);
const alive = () => G.players.filter(p => p.alive);
const has = r => G.deck.includes(r);
const isWolf = p => p.role === 'werwolf' || p.role === 'weisserwolf' || (p.role === 'wildeskind' && G.wildTurned) || (p.role === 'verfluchter' && G.cursed);
const pack = () => alive().filter(isWolf);
const roleName = p => ROLES[p.role].n + (p.role === 'wildeskind' && G.wildTurned ? (BL() ? ' (zum Mörder geworden)' : ' (zum Werwolf geworden)') : '') + (p.role === 'verfluchter' && G.cursed ? ' (zum Mörder geworden)' : '');
const log = t => G.log.push({at: (G.phase === 'night' ? 'Nacht ' : 'Tag ') + G.round, t});
function neighbors(p) { // nächste lebende Nachbarn links/rechts
  const L = G.players, i = L.indexOf(p), res = [];
  for (const dir of [1, -1]) { for (let k = 1; k < L.length; k++) { const q = L[(i + dir * k + L.length * 5) % L.length]; if (q === p) break; if (q.alive) { if (!res.includes(q)) res.push(q); break; } } }
  return res;
}
function nextWolfFrom(seat) { const L = G.players; for (let k = 1; k <= L.length; k++) { const q = L[(seat + k) % L.length]; if (q.alive && isWolf(q)) return q; } return null; }

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && G && G.running) keepAwake(); });

function buildDeck(n = S.players.length) {
  const deck = [];
  for (let i = 0; i < S.wolves; i++) deck.push('werwolf');
  S.roles.forEach(r => { const g = ROLES[r].g || 1; for (let i = 0; i < g; i++) deck.push(r); });
  while (deck.length < n) deck.push('dorf');
  return deck;
}

async function startGame() {
  A.init(); A.resume(); A.volume();
  if (!TEST && 'speechSynthesis' in window) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
  keepAwake();
  const deck = buildDeck(), roles = shuffle(deck);
  G = { running: true, round: 0, phase: 'setup', deck, log: [],
    players: S.players.map((name, i) => ({id: i, name, role: roles[i], alive: true, cause: null})),
    lovers: [], model: null, wildTurned: false, potHeal: true, potPoison: true, lastProtect: null, foxOn: true,
    raven: null, captain: null, captainDone: false, elderHit: false, knightCurse: false, knightSeat: -1, deppOut: [], winner: null };
  document.body.classList.add('ingame');
  window.onbeforeunload = () => G && G.running ? 'Spiel läuft' : undefined;
  await revealRoles();
  A.scene('night'); setSky('night');
  sceneScr(LOGO.replace('<svg', '<svg style="width:120px;height:120px;border-radius:28px"'), 'Düsterwald', 'Legt das Handy in die Mitte des Tisches.', 'Die Geschichte beginnt');
  A.howl(.7);
  await say(line('intro'));
  try {
    while (!G.winner) {
      await night(); if (G.winner) break;
      await morning(); if (G.winner) break;
      await day();
    }
  } catch (e) { if (e !== 'abort') { console.error(e); } else return; }
  await endScreen();
}

async function revealRoles() {
  G.phase = 'setup';
  await info({icon: '🃏', kicker: 'Vorbereitung', title: 'Rollen verteilen',
    html: `<p class="mute">Das Handy wandert jetzt einmal reihum.<br>Jeder hält seine Karte gedrückt, merkt sich die Rolle und gibt das Handy weiter.</p>`, btn: 'Los geht\'s'});
  const L = G.players;
  for (let i = 0; i < L.length; i++) {
    const p = L[i];
    await passTo(p, {step: [i, L.length], hint: 'Die anderen schauen weg.'});
    let ex = '';
    if (isWolf(p)) { const m = L.filter(q => q !== p && isWolf(q)).map(q => q.name); ex = m.length ? 'Dein Rudel: ' + m.map(esc).join(', ') : 'Du jagst allein.'; }
    if (p.role === 'schwestern' || p.role === 'brueder') ex = 'Deine Geschwister: ' + L.filter(q => q !== p && q.role === p.role).map(q => esc(q.name)).join(', ');
    if (p.role === 'wildeskind') ex = 'Dein Vorbild wählst du in der ersten Nacht.';
    if (p.role === 'amor') ex = 'In der ersten Nacht wirst du aufgerufen.';
    await holdReveal(p, 'Deine Rolle', ex);
  }
  await info({icon: '🌕', kicker: 'Alle bereit?', title: 'Alle kennen ihre Rolle', html: '<p class="mute">Legt das Handy in die Mitte. Ab jetzt führt euch der Erzähler durch das Spiel.<br><br>🔊 Lautstärke hoch, Stummschalter aus!</p>', btn: 'Die erste Nacht beginnt'});
}

function setSky(m) { document.body.classList.toggle('day', m === 'day'); }

/* ---------- Nacht ---------- */
async function wake(role, act) {
  // act(holder) – holder lebt; sonst Scheinaufruf, damit niemand erkennt, dass die Rolle tot ist
  const holders = alive().filter(p => p.role === role);
  const R = ROLES[role] || {i: '🐺', n: 'Werwölfe'};
  if (!holders.length && !S.callDead) return;
  const sp = say(line(role + '_w'));
  if (holders.length && act) { await act(holders); await sp; }
  else {
    sceneScr('🌙', 'Die Nacht ist still…', 'Alle Augen bleiben geschlossen.');
    await sp; await sleep(rnd(3500, 7000));
  }
  await say(line(role + '_s'));
}

async function night() {
  G.round++; G.phase = 'night';
  G.n = {victim: null, heal: false, poison: null, protect: null, white: null};
  setSky('night'); A.scene('night');
  sceneScr('🌙', 'Nacht ' + G.round, 'Alle schließen die Augen.', 'Die Nacht bricht herein');
  await say(line('night'));
  const first = G.round === 1;
  if (first && has('amor')) await nightAmor();
  if (first && has('schwestern')) await nightGroup('schwestern');
  if (first && has('brueder')) await nightGroup('brueder');
  if (first && has('wildeskind')) await wake('wildeskind', async ([p]) => {
    G.model = await pick({icon: '🧒', kicker: 'Wildes Kind', title: 'Wähle dein Vorbild', sub: 'Stirbt es, wirst du zum Werwolf.', cands: alive().filter(q => q !== p)});
    log(`Das wilde Kind (${p.name}) wählt ${byId(G.model).name} als Vorbild.`);
    await info({icon: '🧒', title: 'Vorbild gewählt', html: `<p class="mute">Leg das Handy zurück und schließ die Augen.</p>`, btn: 'Fertig'});
  });
  if (has('beschuetzer')) await wake('beschuetzer', async ([p]) => {
    const c = alive().filter(q => q.id !== G.lastProtect);
    const id = await pick({icon: '🛡️', kicker: 'Beschützer', title: 'Wen beschützt du?', sub: G.lastProtect != null ? `${esc(byId(G.lastProtect).name)} darfst du nicht nochmal wählen.` : 'Du darfst auch dich selbst schützen.', cands: c});
    G.n.protect = id; G.lastProtect = id; log(`Der Beschützer (${p.name}) bewacht ${byId(id).name}.`);
  });
  if (has('seherin')) await wake('seherin', async ([p]) => {
    const id = await pick({icon: '🔮', kicker: 'Seherin', title: 'Wessen Rolle willst du sehen?', cands: alive().filter(q => q !== p)});
    const t = byId(id); A.chime(); log(`Die Seherin (${p.name}) sieht: ${t.name} ist ${roleName(t)}.`);
    await info({icon: ROLES[t.role].i, kicker: 'Die Kugel zeigt', title: `${esc(t.name)} ist…`, html: `<div class="tomb"><div class="rn">${roleName(t)}</div><div class="small mute">${isWolf(t) ? '🐺 Gehört zu den Werwölfen' : 'Kein Werwolf'}</div></div><p class="mute small">Merk es dir gut. Dann Handy zurücklegen.</p>`, btn: 'Gesehen', delay: 1200});
  });
  if (has('fuchs')) await wake('fuchs', G.foxOn ? async ([p]) => {
    const id = await pick({icon: '🦊', kicker: 'Fuchs', title: 'Wen beschnupperst du?', sub: 'Ich prüfe ihn und seine beiden Nachbarn.', cands: alive()});
    const t = byId(id), grp = [t, ...neighbors(t)], hit = grp.some(isWolf);
    if (!hit) G.foxOn = false;
    log(`Der Fuchs (${p.name}) beschnuppert ${grp.map(q => q.name).join(', ')}: ${hit ? 'Werwolf dabei' : 'kein Werwolf, Nase verloren'}.`);
    await info({icon: hit ? '🐺' : '🌿', kicker: 'Deine Nase sagt', title: hit ? 'Hier riecht es nach Wolf!' : 'Nichts gerochen…',
      html: `<p class="mute">Geprüft: ${grp.map(q => esc(q.name)).join(', ')}</p>${hit ? '' : '<p class="warn">Deine Nase ist verloren. Ab jetzt kannst du nicht mehr schnuppern.</p>'}`, btn: 'Gesehen', delay: 1000});
  } : null);
  await nightWolves();
  if (has('weisserwolf') && (G.round % 2 === 0 || alive().every(isWolf))) await wake('weisserwolf', async ([p]) => {
    const c = pack().filter(q => q !== p);
    if (!c.length) { await info({icon: '🤍', title: 'Kein Bruder mehr übrig', btn: 'Fertig'}); return; }
    const id = await pick({icon: '🤍', kicker: 'Weißer Werwolf', title: 'Welchen Werwolf zerfleischst du?', cands: c, skip: 'Heute niemanden', cls: 'wolf'});
    if (id != null) { G.n.white = id; log(`Der weiße Werwolf (${p.name}) tötet ${byId(id).name}.`); }
  });
  if (has('hexe')) await wake('hexe', nightWitch);
  if (has('rabe')) await wake('rabe', async ([p]) => {
    const id = await pick({icon: '🐦‍⬛', kicker: 'Rabe', title: 'Wen verfluchst du?', sub: 'Er startet die Abstimmung mit +2 Stimmen.', cands: alive().filter(q => q !== p), skip: 'Niemanden'});
    G.raven = id; if (id != null) log(`Der Rabe (${p.name}) markiert ${byId(id).name}.`);
  });
}

async function nightAmor() {
  await wake('amor', async ([p]) => {
    const ids = await pick({icon: '💘', kicker: 'Amor', title: 'Wen verliebst du?', sub: 'Tippe genau zwei Spieler an (du darfst dich selbst wählen).', cands: alive(), n: 2, ok: 'Pfeile abschießen'});
    G.lovers = ids; A.chime(); log(`Amor (${p.name}) verliebt ${ids.map(i => byId(i).name).join(' und ')}.`);
    await info({icon: '💘', title: 'Die Pfeile fliegen…', html: '<p class="mute">Leg das Handy zurück in die Mitte und schließ die Augen.</p>', btn: 'Erledigt'});
  });
  // Geheime Botschaft: Jeder bekommt das Handy einmal – so erfahren die Verliebten es, ohne dass jemand die Augen öffnen muss
  sceneScr('✉️', 'Geheime Botschaften', 'Das Handy wandert einmal im Kreis.', 'Nur wer das Handy hält, öffnet die Augen');
  await say(line('lovers_round'));
  const L = alive();
  for (let i = 0; i < L.length; i++) {
    const p = L[i];
    await passTo(p, {step: [i, L.length], hint: 'Augen auf, Botschaft lesen, weitergeben, Augen zu.', btn: 'Ich bin ' + esc(p.name) + ' – Botschaft öffnen'});
    const lov = G.lovers.includes(p.id), other = lov ? byId(G.lovers.find(x => x !== p.id)) : null;
    await info(lov
      ? {icon: '💞', kicker: 'Geheime Botschaft', title: 'Du bist verliebt!', html: `<div class="tomb"><div class="small mute">Dein Herz gehört</div><div class="rn">${esc(other.name)}</div></div><p class="mute small">Stirbt einer von euch, stirbt der andere vor Kummer. Bleibt am Ende nur ihr zwei übrig, gewinnt ihr gemeinsam, auch gegen euer eigenes Team.</p>`, btn: 'Gelesen – weitergeben', delay: 2500}
      : {icon: '🕯️', kicker: 'Geheime Botschaft', title: 'Keine Botschaft für dich', html: `<p class="mute">Amors Pfeil hat dich verfehlt.<br>Warte kurz, damit niemand am Tempo etwas merkt.</p>`, btn: 'Gelesen – weitergeben', delay: 2500});
  }
  sceneScr('💞', 'Alle Botschaften überbracht', 'Legt das Handy zurück in die Mitte.');
  await say(line('lovers_done'));
}

async function nightGroup(role) {
  await wake(role, async (hs) => {
    await info({icon: ROLES[role].i, kicker: ROLES[role].gn, title: 'Ihr gehört zusammen', html: `<div class="tomb">${hs.map(h => `<div class="rn">${esc(h.name)}</div>`).join('')}</div><p class="mute small">Schaut euch an und nickt euch zu.</p>`, btn: 'Wir kennen uns', delay: 1500});
  });
}

async function nightWolves() {
  const P = pack(), prey = alive().filter(p => !isWolf(p));
  if (!prey.length) return;
  const sp = say(line('werwoelfe_w'));
  setTimeout(() => A.howl(.5, 260), 400);
  const first = G.round === 1;
  G.n.victim = await pick({icon: '🐺', kicker: 'Werwölfe', title: 'Wer wird gefressen?', cls: 'wolf', ok: 'Zerreißen',
    sub: (first || G.wildTurned) ? `Euer Rudel: ${P.map(p => esc(p.name)).join(', ')}` : 'Einigt euch lautlos. Einer tippt.',
    cands: prey});
  log(`Die Werwölfe (${P.map(p => p.name).join(', ')}) wählen ${byId(G.n.victim).name}.`);
  vib([30, 40, 30]);
  await sp; await say(line('werwoelfe_s'));
}

async function nightWitch([p]) {
  const v = G.n.victim != null ? byId(G.n.victim) : null;
  if (v && G.potHeal) {
    const heal = await choice({icon: '🧪', kicker: 'Hexe', title: `Die Werwölfe haben ${esc(v.name)} gewählt`, html: '<p class="mute">Willst du deinen Heiltrank benutzen? Er wirkt nur ein einziges Mal.</p>',
      options: [{label: '💚 Ja, retten', value: true, cls: 'primary'}, {label: 'Nein', value: false, cls: 'ghost'}]});
    if (heal) { G.potHeal = false; G.n.heal = true; log(`Die Hexe (${p.name}) rettet ${v.name}.`); }
  } else if (v) {
    await info({icon: '🧪', kicker: 'Hexe', title: `Die Werwölfe haben ${esc(v.name)} gewählt`, html: '<p class="mute">Dein Heiltrank ist leider aufgebraucht.</p>', btn: 'Weiter'});
  }
  if (G.potPoison) {
    const id = await pick({icon: '☠️', kicker: 'Hexe', title: 'Willst du jemanden vergiften?', sub: 'Der Gifttrank wirkt nur ein einziges Mal.', cands: alive(), skip: 'Kein Gift', ok: 'Vergiften', cls: 'wolf'});
    if (id != null) { G.potPoison = false; G.n.poison = id; log(`Die Hexe (${p.name}) vergiftet ${byId(id).name}.`); }
  } else if (!G.potHeal) {
    await info({icon: '🧪', kicker: 'Hexe', title: 'Deine Tränke sind leer', html: '<p class="mute">Warte kurz und leg das Handy zurück.</p>', btn: 'Fertig', delay: 2000});
  }
}

/* ---------- Tod & Folgen ---------- */
const CAUSE = {wolf: 'In der Nacht gestorben', poison: 'In der Nacht gestorben', white: 'In der Nacht gestorben', knight: 'Vom Schwert des Ritters vergiftet', love: 'An gebrochenem Herzen gestorben', vote: 'Vom Dorf hingerichtet', hunter: 'Vom Jäger erschossen', scape: 'Als Sündenbock geopfert'};
const CAUSE_B = {wolf: 'Ermordet', poison: 'Ermordet', slash: 'Vom Schlächter geholt', knight: 'Am Gift des Ritters gestorben', love: 'An gebrochenem Herzen gestorben', vote: 'Vom Dorf gehängt', hunter: 'Vom Jäger erschossen', scape: 'Als Sündenbock gehängt'};
const causeT = c => (BL() && CAUSE_B[c]) || CAUSE[c];
async function killAll(list) {
  const q = list.slice();
  while (q.length) {
    const {p, cause} = q.shift();
    if (!p.alive) continue;
    p.alive = false; p.cause = CAUSE[cause] + ' (' + (G.phase === 'night' || G.phase === 'morning' ? 'Nacht ' : 'Tag ') + G.round + ')';
    log(`${p.name} stirbt (${CAUSE[cause]}) – war ${roleName(p)}.`);
    // Ansage
    const other = G.lovers.includes(p.id) ? byId(G.lovers.find(x => x !== p.id)) : null;
    const key = {wolf: 'd_night', poison: 'd_night', white: 'd_night', love: 'd_love', vote: 'd_vote', hunter: 'd_hunter', knight: 'd_knight', scape: 'd_scape'}[cause];
    const lovedOne = cause === 'love' ? (G.lovers.map(byId).find(x => x !== p) || {}).name : '';
    flash(); A.gong(); vib([60, 50, 120]);
    sceneScr(cause === 'love' ? '💔' : cause === 'vote' || cause === 'scape' ? '⚖️' : cause === 'hunter' ? '🏹' : '🪦', esc(p.name), CAUSE[cause], '† Tot');
    app.firstChild.classList.add('dead');
    await say(line(key, {name: p.name, other: lovedOne}));
    await info({icon: S.reveal ? ROLES[p.role].i : '🪦', kicker: '† ' + CAUSE[cause], title: esc(p.name), cls: 'dead',
      html: S.reveal ? `<div class="tomb"><div class="small mute">war</div><div class="rn">${roleName(p)}</div></div>` : '<p class="mute">Die Rolle bleibt ein Geheimnis.</p>', btn: 'Weiter', delay: 800,
    });
    if (S.reveal) {/* Rolle wird angezeigt, aber nicht vorgelesen, um Zeit zu sparen */}
    // Engel
    if (p.role === 'engel' && G.round === 1) { G.winner = 'engel'; G.angel = p; await say(line('angel', {name: p.name})); return; }
    // Liebende
    if (other && other.alive) q.unshift({p: other, cause: 'love'});
    // Wildes Kind
    if (G.model === p.id && !G.wildTurned) { const k = G.players.find(x => x.role === 'wildeskind'); if (k && k.alive) { G.wildTurned = true; log(`${k.name} (Wildes Kind) verliert sein Vorbild und wird zum Werwolf.`); } }
    // Jäger
    if (p.role === 'jaeger') {
      A.growl();
      await say(line('hunter', {name: p.name}));
      const c = alive();
      if (c.length) {
        const id = await pick({icon: '🏹', kicker: 'Letzter Schuss', title: `${esc(p.name)}, wen nimmst du mit?`, cands: c, ok: 'Schießen', cls: 'wolf'});
        A.shot(); q.unshift({p: byId(id), cause: 'hunter'});
      }
    }
    // Hauptmann
    if (G.captain === p.id) {
      G.captain = null; const c = alive().filter(x => !q.some(e => e.p === x));
      if (c.length) {
        await say(line('captain_dead', {name: p.name}));
        const id = await pick({icon: '🎖️', kicker: 'Nachfolger', title: `${esc(p.name)}, wer wird neuer Hauptmann?`, cands: c});
        G.captain = id; log(`${byId(id).name} wird neuer Hauptmann.`); await say(line('captain_set', {name: byId(id).name}));
      }
    }
  }
}

function checkWin() {
  if (G.winner) return G.winner;
  const L = alive(), P = L.filter(isWolf), sl = L.find(p => p.role === 'schlaechter');
  if (!L.length) G.winner = 'none';
  else if (L.length === 2 && G.lovers.length === 2 && L.every(p => G.lovers.includes(p.id))) G.winner = 'lovers';
  else if (sl && L.length <= 2) G.winner = 'slasher';
  else if (L.length === 1 && L[0].role === 'weisserwolf') G.winner = 'white';
  else if (sl) { /* Solange der Schlächter lebt, gewinnt niemand sonst */ }
  else if (!P.length) G.winner = 'dorf';
  else if (P.length === L.length && !P.some(p => p.role === 'weisserwolf' && P.length > 1)) G.winner = 'wolf';
  return G.winner;
}

/* ---------- Morgen ---------- */
async function morning() {
  G.phase = 'morning'; setSky('day'); A.scene('day'); A.bell(3);
  sceneScr('🌅', 'Tag ' + G.round, 'Öffnet eure Augen.', 'Der Morgen graut');
  await say(line('dawn'));
  const deaths = [], add = (p, cause) => { if (p && p.alive && !deaths.some(d => d.p === p)) deaths.push({p, cause}); };
  if (G.knightCurse) { G.knightCurse = false; add(nextWolfFrom(G.knightSeat), 'knight'); }
  const v = G.n.victim != null ? byId(G.n.victim) : null;
  if (v && v.alive) {
    if (G.n.protect === v.id) log(`${v.name} wurde vom Beschützer gerettet.`);
    else if (G.n.heal) {}
    else if (v.role === 'aeltester' && !G.elderHit) { G.elderHit = true; log(`${v.name} (Dorfältester) überlebt den Angriff.`); }
    else { add(v, 'wolf'); if (v.role === 'ritter') { G.knightCurse = true; G.knightSeat = G.players.indexOf(v); } }
  }
  if (G.n.white != null) add(byId(G.n.white), 'white');
  if (G.n.poison != null) add(byId(G.n.poison), 'poison');
  if (!deaths.length) {
    A.chime(); sceneScr('🕊️', 'Niemand ist gestorben', 'Alle haben die Nacht überlebt.');
    await say(line('nobody'));
  } else {
    sceneScr('🩸', deaths.length > 1 ? deaths.length + ' Tote' : 'Ein Toter', 'Die Nacht hat ihren Tribut gefordert.');
    document.body.classList.add('blood'); setTimeout(() => document.body.classList.remove('blood'), 4000);
    await say(line('some'));
    await killAll(shuffle(deaths));
  }
  if (checkWin()) return;
  // Bär
  const b = alive().find(p => p.role === 'baer');
  if (b) {
    const hit = neighbors(b).some(isWolf);
    if (hit) { A.growl(); sceneScr('🐻', 'Der Bär brummt!', `Neben ${esc(b.name)} lauert ein Werwolf.`); await say(line('bear_yes', {name: b.name})); }
    else { sceneScr('🐻', 'Der Bär bleibt ruhig', ''); await say(line('bear_no')); }
  }
}

/* ---------- Tag ---------- */
async function day() {
  G.phase = 'day';
  if (S.captain && !G.captainDone) {
    G.captainDone = true;
    sceneScr('🎖️', 'Hauptmannswahl', 'Seine Stimme zählt doppelt.');
    await say(line('captain_vote'));
    const id = await pick({icon: '🎖️', kicker: 'Hauptmannswahl', title: 'Wer wurde gewählt?', sub: 'Stimmt per Handzeichen ab und tippt den Gewinner an.', cands: alive()});
    G.captain = id; log(`${byId(id).name} wird Hauptmann.`); A.chime();
    await say(line('captain_set', {name: byId(id).name}));
  }
  const rv = G.raven != null ? byId(G.raven) : null;
  if (rv && !rv.alive) G.raven = null;
  if (G.raven != null) { sceneScr('🐦‍⬛', 'Der Rabe hat gesprochen', `${esc(rv.name)} startet mit +2 Stimmen.`); await say(line('raven', {name: rv.name})); }
  await discussion();
  await vote();
  G.raven = null;
}

function discussion() {
  return new Promise(async res => {
    let left = S.discuss * 60, paused = false, warned = false, iv;
    const total = Math.max(left, 1), R = 120, C = 2 * Math.PI * R;
    const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    const L = alive();
    render(`<div class="scr center">
      <div class="kicker">Tag ${G.round} · Beratung</div><h2 style="color:var(--gold)">Wer ist der Werwolf?</h2>
      ${S.discuss ? `<div class="timer" id="tm"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="${R}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/><circle id="arc" cx="130" cy="130" r="${R}" fill="none" stroke="var(--gold2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear"/></svg><div class="t" id="tt">${fmt(left)}</div></div>
      <div class="row" style="justify-content:center"><button class="btn sm" id="minus">−30 s</button><button class="btn sm" id="pause">⏸ Pause</button><button class="btn sm" id="plus">+1 Min</button></div>` : '<div class="big" style="font-size:4rem;margin:20px 0">🗣️</div>'}
      <div class="chips" style="justify-content:center;margin-top:18px">${L.map(p => `<span class="chip">${esc(p.name)}${G.captain === p.id ? ' 🎖️' : ''}${G.deppOut.includes(p.id) ? ' 🤪' : ''}</span>`).join('')}</div>
      <div class="acts"><button class="btn blood" id="go">⚖️ Zur Abstimmung</button></div></div>`);
    const done = () => { clearInterval(iv); res(); };
    $('#go').onclick = async () => { clearInterval(iv); await say(line('vote')); res(); };
    if (S.discuss) {
      $('#pause').onclick = e => { paused = !paused; e.target.textContent = paused ? '▶ Weiter' : '⏸ Pause'; };
      $('#plus').onclick = () => { left += 60; warned = false; };
      $('#minus').onclick = () => { left = Math.max(5, left - 30); };
      const tick = () => {
        if (!$('#tt')) return clearInterval(iv);
        $('#tt').textContent = fmt(left); $('#arc').style.strokeDashoffset = C * (1 - left / Math.max(total, left));
        $('#tm').classList.toggle('low', left <= 10);
        if (left === 30 && !warned) { warned = true; say(line('t30')); }
        if (left <= 10 && left > 0) A.beat(1);
        if (left <= 0) { clearInterval(iv); A.bell(1, 147); say(line('vote')).then(done); return; }
        if (!paused) left--;
      };
      iv = setInterval(tick, TEST ? 1 : 1000);
    }
    say(S.discuss ? line('discuss', {min: S.discuss}) : line('discuss_free'));
  });
}

async function vote() {
  const L = alive(), voters = L.filter(p => !G.deppOut.includes(p.id));
  const tally = {}; L.forEach(p => tally[p.id] = 0);
  if (G.raven != null && tally[G.raven] != null) tally[G.raven] += 2;
  if (S.voteMode === 'geheim') {
    sceneScr('🗳️', 'Geheime Abstimmung', 'Das Handy wandert reihum.');
    await say(line('vote_secret'));
    for (let i = 0; i < voters.length; i++) {
      const v = voters[i];
      await passTo(v, {step: [i, voters.length], hint: 'Stimme geheim ab. Niemand schaut zu.'});
      const id = await pick({icon: '🗳️', kicker: esc(v.name) + (G.captain === v.id ? ' · Hauptmann (2 Stimmen)' : ''), title: 'Wer soll sterben?', cands: L.filter(p => p !== v), skip: 'Enthaltung', ok: 'Stimme abgeben', cls: 'wolf'});
      if (id != null) tally[id] += G.captain === v.id ? 2 : 1;
      vib(15);
    }
  } else {
    sceneScr('☝️', 'Offene Abstimmung', 'Alle zeigen gleichzeitig.');
    await say(line('vote_open'));
    await new Promise(res => {
      const cnt = {}; L.forEach(p => cnt[p.id] = 0); let cap = null;
      const draw = () => {
        render(`<div class="scr"><div class="kicker center">Offene Abstimmung</div><h2 class="center" style="color:var(--gold)">Stimmen zählen</h2>
          <p class="center mute small">Tippe für jeden Spieler ein, wie viele auf ihn zeigen. ${voters.length} Stimmberechtigte.${G.raven != null ? ' Der Rabe zählt automatisch +2.' : ''}</p>
          <div>${L.map(p => `<div class="vrow"><span class="nm">${esc(p.name)}${G.raven === p.id ? ' 🐦‍⬛' : ''}</span><button class="ib" data-m="${p.id}">−</button><b>${cnt[p.id]}</b><button class="ib" data-p="${p.id}">+</button></div>`).join('')}</div>
          ${G.captain != null && byId(G.captain).alive ? `<div class="card"><label class="small mute">🎖️ Hauptmann ${esc(byId(G.captain).name)} hat gezeigt auf (zählt doppelt):</label><select id="cap2" style="width:100%;margin-top:6px"><option value="">–</option>${L.filter(p => p.id !== G.captain).map(p => `<option value="${p.id}" ${cap === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>` : ''}
          <div class="acts"><button class="btn blood confirm" id="ok">Auswerten</button></div></div>`);
        app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { cnt[b.dataset.p]++; draw(); });
        app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { cnt[b.dataset.m] = Math.max(0, cnt[b.dataset.m] - 1); draw(); });
        const cs = $('#cap2'); if (cs) cs.onchange = () => { cap = cs.value === '' ? null : +cs.value; };
        $('#ok').onclick = () => { L.forEach(p => tally[p.id] += cnt[p.id]); if (cap != null) tally[cap] += 1; res(); };
      };
      draw();
    });
  }
  // Ergebnis
  const max = Math.max(...Object.values(tally));
  const top = max > 0 ? L.filter(p => tally[p.id] === max) : [];
  const sorted = L.slice().sort((a, b) => tally[b.id] - tally[a.id]);
  A.beat(3);
  render(`<div class="scr"><div class="kicker center">Das Urteil</div><h2 class="center" style="color:var(--gold)">Die Stimmen</h2>
    <div class="bars">${sorted.map(p => `<div class="bar ${top.includes(p) ? 'top' : ''}"><i data-w="${max ? tally[p.id] / max * 100 : 0}" style="width:0"></i><span>${esc(p.name)}</span><span>${tally[p.id]}</span></div>`).join('')}</div></div>`);
  requestAnimationFrame(() => setTimeout(() => app.querySelectorAll('.bar i').forEach(i => i.style.width = i.dataset.w + '%'), 50));
  await sleep(2600);
  let target = null, cause = 'vote';
  log(`Abstimmung: ${sorted.filter(p => tally[p.id]).map(p => p.name + ' ' + tally[p.id]).join(', ') || 'keine Stimmen'}.`);
  if (top.length === 1) target = top[0];
  else if (top.length > 1) {
    const sb = alive().find(p => p.role === 'suendenbock');
    if (sb) { target = sb; cause = 'scape'; }
    else if (G.captain != null && byId(G.captain).alive) {
      sceneScr('🎖️', 'Gleichstand!', 'Der Hauptmann entscheidet.'); await say(line('tie_cap'));
      const id = await pick({icon: '🎖️', kicker: 'Hauptmann ' + esc(byId(G.captain).name), title: 'Wer stirbt?', cands: top, ok: 'Urteil fällen', cls: 'wolf'});
      target = byId(id);
    } else { sceneScr('🤷', 'Gleichstand', 'Heute stirbt niemand.'); await say(line('tie_none')); log('Gleichstand – niemand stirbt.'); return; }
  } else { sceneScr('🤷', 'Keine Stimmen', 'Heute stirbt niemand.'); await say(line('tie_none')); return; }
  if (target.role === 'depp' && cause === 'vote' && !G.deppOut.includes(target.id)) {
    G.deppOut.push(target.id); log(`${target.name} ist der Dorfdepp und überlebt, darf aber nicht mehr abstimmen.`);
    sceneScr('🤪', esc(target.name), 'ist der Dorfdepp!'); await say(line('depp', {name: target.name}));
    await info({icon: '🤪', title: esc(target.name) + ' überlebt', html: '<p class="mute">…darf aber ab jetzt nicht mehr abstimmen.</p>', btn: 'Weiter'});
    return;
  }
  await killAll([{p: target, cause}]);
  checkWin();
}

/* ---------- Spielende ---------- */
async function endScreen() {
  G.running = false; window.onbeforeunload = null;
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  const w = G.winner;
  const T = {dorf: ['🌄', 'Das Dorf gewinnt!', 'w_dorf'], wolf: ['🐺', 'Die Werwölfe gewinnen!', 'w_wolf'], white: ['🤍', 'Der weiße Werwolf gewinnt!', 'w_white'],
    lovers: ['💞', 'Das Liebespaar gewinnt!', 'w_lovers'], engel: ['😇', 'Der Engel gewinnt!', null], none: ['👻', 'Niemand gewinnt', 'w_none']}[w];
  if (w === 'wolf' || w === 'white') { setSky('night'); A.scene('night'); A.howl(.8); setTimeout(() => A.howl(.6, 340), 1500); }
  else { setSky('day'); A.scene('day'); A.bell(5, 220); }
  const conf = w === 'wolf' ? '🩸' : w === 'lovers' ? '💖' : '✨';
  for (let i = 0; i < 40; i++) setTimeout(() => { const s = document.createElement('div'); s.className = 'confetti'; s.textContent = conf; s.style.left = rnd(0, 100) + 'vw'; s.style.animationDuration = rnd(2.5, 5) + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 5200); }, i * 90);
  render(`<div class="win"><div class="hero"><div class="big" style="font-size:5rem">${T[0]}</div></div><h1>${T[1]}</h1>
    <p class="center mute">Nach ${G.round} ${G.round === 1 ? 'Nacht' : 'Nächten'}${G.angel ? ` · ${esc(G.angel.name)} war der Engel` : ''}</p>
    <div class="card"><h3>🃏 Alle Rollen</h3><table class="tbl">${G.players.map(p => `<tr><td>${ROLES[p.role].i}</td><td><b class="${p.alive ? '' : 'strike'}">${esc(p.name)}</b>${G.lovers.includes(p.id) ? ' 💘' : ''}${G.captain === p.id ? ' 🎖️' : ''}<div class="small mute">${roleName(p)}</div></td><td class="small mute" style="text-align:right">${p.alive ? '✅ lebt' : esc(p.cause || '')}</td></tr>`).join('')}</table></div>
    <details class="card"><summary><h3>📜 Was wirklich geschah</h3></summary><div class="log">${G.log.map(l => `<div><b>${l.at}</b> · ${esc(l.t)}</div>`).join('')}</div></details>
    <div class="acts" style="flex-direction:column"><button class="btn primary endagain" id="again">🔁 Nochmal mit denselben Spielern</button><button class="btn ghost" id="setup">Spieler oder Rollen ändern</button></div></div>`);
  document.body.classList.remove('ingame');
  $('#again').onclick = () => startGame();
  $('#setup').onclick = () => { A.scene('none'); setSky('night'); setup(); };
  if (T[2]) await say(line(T[2]));
  window.__lastWinner = w;
}

function preset(n) {
  let w = n <= 5 ? 1 : n <= 8 ? 2 : n <= 12 ? 3 : 4;
  const bl = BL(); if (bl) w = n <= 5 ? 1 : n <= 12 ? 2 : n <= 16 ? 3 : 4;
  const minVill = Math.ceil(n * .22), slots = Math.max(1, n - w - minVill);
  const r = []; let used = 0;
  for (const k of bl ? SPECIAL_ORDER_B : SPECIAL_ORDER) {
    const g = ROLES[k].g || 1; if (k === 'brueder' || k === 'schwestern') continue;
    if (bl && ((k === 'schlaechter' && n < 10) || (k === 'verfluchter' && n < 7) || (k === 'forensik' && n < 6))) continue;
    if (used + g <= slots) { r.push(k); used += g; }
  }
  return {w, r};
}
function cardCount() { return S.wolves + S.roles.reduce((s, r) => s + (ROLES[r].g || 1), 0); }

/* =========================================================
   MEHRSPIELER – jeder spielt mit seinem eigenen Handy
   Verbindung: MQTT über WebSocket (öffentliche Server, kein Konto nötig)
   Alles Private ist Ende-zu-Ende verschlüsselt (ECDH + AES-GCM).
   ========================================================= */
// Reihenfolge = Vorrang. Port 443 zuerst, weil Firmen-/Schulnetze andere Ports oft sperren.
const BROKERS = (() => { const m = location.search.match(/[?&]broker=([^&]+)/); return m ? decodeURIComponent(m[1]).split(',') : ['wss://mqtt.eclipseprojects.io:443/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt']; })();
const TP = 'wwdw1/';

/* ---------- Minimaler MQTT-3.1.1-Client ---------- */
class MQ {
  constructor(url) { this.url = url; this.subs = new Set(); this.pid = 1; this.buf = new Uint8Array(0); this.closed = false; this.q = []; this.onmsg = null; this.onstate = null; this.up = false; }
  static str(s) { const b = TE.encode(s); const o = new Uint8Array(2 + b.length); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; }
  static pkt(h, parts) {
    let len = parts.reduce((a, p) => a + p.length, 0); const body = len; const rl = [];
    do { let d = len % 128; len = Math.floor(len / 128); if (len > 0) d |= 128; rl.push(d); } while (len > 0);
    const o = new Uint8Array(1 + rl.length + body); o[0] = h; o.set(rl, 1); let off = 1 + rl.length;
    for (const p of parts) { o.set(p, off); off += p.length; } return o;
  }
  connect() {
    return new Promise((res, rej) => {
      let ok = false, ws;
      try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { rej(e); return; }
      ws.binaryType = 'arraybuffer'; this.ws = ws; this.buf = new Uint8Array(0);
      const to = setTimeout(() => { if (!ok) { try { ws.close(); } catch (e) {} rej(new Error('timeout')); } }, 7000);
      ws.onopen = () => {
        const cid = 'wwdw' + Math.random().toString(36).slice(2, 12);
        this.raw(MQ.pkt(0x10, [new Uint8Array([0, 4, 77, 81, 84, 84, 4, 2, 0, 30]), MQ.str(cid)]));
      };
      ws.onmessage = e => this.feed(new Uint8Array(e.data), rc => { if (rc === 0) { ok = true; clearTimeout(to); res(); } else { clearTimeout(to); rej(new Error('refused ' + rc)); } });
      ws.onerror = () => {};
      ws.onclose = () => {
        clearTimeout(to); clearInterval(this.ping);
        if (!ok) { rej(new Error('closed')); return; }
        this.up = false; this.onstate && this.onstate(false);
        if (!this.closed) setTimeout(() => this.reconnect(), 1500);
      };
    });
  }
  async reconnect() { if (this.closed) return; try { await this.connect(); this.afterConnect(); } catch (e) { setTimeout(() => this.reconnect(), 2500); } }
  afterConnect() {
    this.up = true;
    for (const t of this.subs) this._sub(t);
    clearInterval(this.ping); this.ping = setInterval(() => this.raw(new Uint8Array([0xC0, 0])), 20000);
    const q = this.q; this.q = []; q.forEach(p => this.raw(p));

  }
  feed(chunk, onAck) {
    const b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length); this.buf = b;
    for (;;) {

      do { if (i >= B.length) return; d = B[i++]; len += (d & 127) * mul; mul *= 128; } while (d & 128);
      if (B.length < i + len) return;
      const h = B[0], body = B.subarray(i, i + len); this.buf = B.slice(i + len);
      const type = h >> 4;

        const qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1]; const topic = TD.decode(body.subarray(2, 2 + tl)); let off = 2 + tl;

      } else if (type === 6) { // PUBREL (QoS 2) -> PUBCOMP

      }
    }
  }
  raw(u8) { if (this.ws && this.ws.readyState === 1) { try { this.ws.send(u8); } catch (e) {} } }
  nid() { this.pid = (this.pid % 65000) + 1; return this.pid; }
  sub(t) { this.subs.add(t); if (this.up) this._sub(t); }
  _sub(t) { const id = this.nid(); this.raw(MQ.pkt(0x82, [new Uint8Array([id >> 8, id & 255]), MQ.str(t), new Uint8Array([1])])); }
  pub(t, s, retain = false) {
    const id = this.nid();
    const p = MQ.pkt(0x30 | 2 | (retain ? 1 : 0), [MQ.str(t), new Uint8Array([id >> 8, id & 255]), TE.encode(s)]);

}

/* ---------- Verschlüsselung ---------- */
const TE = new TextEncoder(), TD = new TextDecoder();
const b64 = u => { u = new Uint8Array(u); let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); };
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const CR = {
  async room(code) {
    const base = await crypto.subtle.importKey('raw', TE.encode(code), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt: TE.encode('duesterwald:' + code), iterations: 40000, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  },
  pair() { return crypto.subtle.generateKey({name: 'ECDH', namedCurve: 'P-256'}, true, ['deriveKey']); },
  async pub(kp) { return b64(await crypto.subtle.exportKey('raw', kp.publicKey)); },
  async shared(kp, pubB64) {
    const pk = await crypto.subtle.importKey('raw', ub64(pubB64), {name: 'ECDH', namedCurve: 'P-256'}, false, []);
    return crypto.subtle.deriveKey({name: 'ECDH', public: pk}, kp.privateKey, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  },
  async seal(k, o) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, k, TE.encode(JSON.stringify(o))); return b64(iv) + '.' + b64(ct); },
  async open(k, s) { const [i, d] = s.split('.'); const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: ub64(i)}, k, ub64(d)); return JSON.parse(TD.decode(pt)); }
};
const genCode = () => { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; const r = crypto.getRandomValues(new Uint8Array(5)); for (const x of r) s += A[x % A.length]; return s; };

/* ---------- QR-Code als SVG ---------- */
function qrSVG(text) {
  try {
    const {QRCode, ECL} = window.QRCodeLib; const q = new QRCode(-1, ECL.M); q.addData(text); q.make();
    const n = q.getModuleCount(), m = 2; let r = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) r += `M${x + m} ${y + m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#f4ead2"/><path d="${r}" fill="#07060d"/></svg>`;
  } catch (e) { return ''; }
}

/* Alle Server gleichzeitig probieren; der erste, der antwortet, gewinnt */
function netOpen(list) {
  return new Promise((res, rej) => {
    let left = list.length, won = false;
    list.forEach((u, i) => {
      const m = new MQ(u);
      m.connect().then(() => { if (won) { m.close(); return; } won = true; m.afterConnect(); res({mq: m, idx: i}); },
        () => { m.closed = true; if (--left === 0 && !won) rej(new Error('Keine Verbindung zum Spielserver')); });
    });
  });
}
function secureOK() { return window.isSecureContext && window.crypto && crypto.subtle; }
const NET_HELP = 'Im Firmen-, Schul- oder Hotel-WLAN sind solche Verbindungen oft gesperrt. Schalte WLAN aus und probier es mit <b>mobilen Daten</b> (oder über den Hotspot eines Handys).';
const FILE_HELP = 'Öffne das Spiel bitte über den Link <b>hussien888.github.io/Werwolf-By-Hussien</b> und nicht als Datei vom Computer, sonst funktioniert die Verschlüsselung nicht.';

async function mpHostStart() {
  if (!secureOK()) return errScreen('So geht es nicht', FILE_HELP);
  connScreen('Raum wird erstellt…', 'Verbinde mit dem Spielserver');
  try {
    MP.on = true; MP.host = true; MP.code = genCode();
    MP.rk = await CR.room(MP.code); MP.kp = await CR.pair(); MP.hostPub = await CR.pub(MP.kp);
    const {mq, idx} = await netOpen(BROKERS); MP.mq = mq; MP.bIdx = Math.max(0, idx); MP.netOk = true;
    mq.onmsg = (t, s) => hostMsg(t, s).catch(e => console.error(e));
    mq.onstate = ok => { MP.netOk = ok; if (ok) { publishInfo(); sendPub(); MP.players.forEach(sendPriv); } netDot(); };
    mq.sub(TP + MP.code + '/up');
    publishInfo();
    MP.players = []; if (S.mpPlay) addHostPlayer();
    MP.pub = {ph: 'lobby', code: MP.code};
    setInterval(() => { if (!MP.host) return; const now = Date.now(); let ch = false; MP.players.forEach(p => { if (!p.local) { const c = now - (p.last || 0) < 22000; if (c !== p.conn) { p.conn = c; ch = true; } } }); if (ch && MP.pub.ph === 'lobby') hostLobbyRefresh(); sendPub(); }, 5000);
    window.addEventListener('pagehide', () => { try { MP.mq.pub(TP + MP.code + '/info', '', true); } catch (e) {} });
    hostLobby();
  } catch (e) {
    console.error(e); MP.on = false; MP.host = false;
    errScreen('Keine Verbindung', 'Keiner der Spielserver ist von hier aus erreichbar. ' + NET_HELP, mpHostStart);
  }
}
function publishInfo() { CR.seal(MP.rk, {hostPub: MP.hostPub, v: 1}).then(s => MP.mq.pub(TP + MP.code + '/info', s, true)); }
function addHostPlayer() {
  if (MP.players.some(p => p.local)) return;
  const p = {id: 0, cid: 'host', name: (S.hostName || 'Spielleiter').trim().slice(0, 18), local: true, conn: true};
  MP.players.unshift(p); MP.me = p;

function removeHostPlayer() { MP.players = MP.players.filter(p => !p.local); MP.me = null; }

async function hostMsg(t, s) {
  if (!t.endsWith('/up') || !s) return;
  let m; try { m = JSON.parse(s); } catch (e) { return; }
  if (!m || !m.c) return;
  if (m.t === 'hello') {
    let h; try { h = await CR.open(MP.rk, m.d); } catch (e) { return; }
    const name = String(h.name || '').replace(/\s+/g, ' ').trim().slice(0, 18) || 'Spieler';
    let p = MP.players.find(x => x.cid === m.c);
    if (!p) {
      const same = MP.players.find(x => !x.local && x.name.toLowerCase() === name.toLowerCase());
      if (MP.pub.ph === 'lobby') {
        if (same && !same.conn) { p = same; p.cid = m.c; }
        else if (MP.players.length >= 24) { return rejectJoin(m.c, h.pub, 'Der Raum ist voll.'); }
        else { let nm = name, k = 2; while (MP.players.some(x => x.name.toLowerCase() === nm.toLowerCase())) nm = name.slice(0, 15) + ' ' + k++; p = {id: 0, cid: m.c, name: nm, conn: true}; MP.players.push(p); }
      } else {
        if (same) { p = same; p.cid = m.c; } else return rejectJoin(m.c, h.pub, 'Das Spiel läuft bereits. Tritt mit genau deinem Namen von vorhin bei, um zurückzukehren.');
      }
    }
    p.key = await CR.shared(MP.kp, h.pub); p.conn = true; p.last = Date.now();
    sendPriv(p); sendPub();
    if (MP.pub.ph === 'lobby') hostLobbyRefresh();
    return;
  }
  const p = MP.players.find(x => x.cid === m.c); if (!p || !p.key) return;
  let d; try { d = await CR.open(p.key, m.d); } catch (e) { return; }
  p.last = Date.now(); if (!p.conn) { p.conn = true; sendPub(); if (MP.pub.ph === 'lobby') hostLobbyRefresh(); }
  hostInput(p, d);
}
async function rejectJoin(cid, pub, msg) { try { const k = await CR.shared(MP.kp, pub); MP.mq.pub(TP + MP.code + '/p/' + cid, await CR.seal(k, {v: 1e12, err: msg})); } catch (e) {} }

function hostInput(p, d) {
  if (d.t === 'ans') { if (p.pending && p.pending.rid === d.rid) { const r = p.pending.res; p.pending = null; r(d.val); } }
  else if (d.t === 'sel') { if (MP.hunt && p.view && p.view.rid === d.rid && p.view.hunt) MP.hunt.onSel(p, d.val); }
  else if (d.t === 'bye') { p.conn = false; p.last = 0; sendPub(); if (MP.pub.ph === 'lobby') { MP.players = MP.players.filter(x => x !== p); hostLobbyRefresh(); } }
}

const BOT_NAMES = ['Lena', 'Mo', 'Sara', 'Ali', 'Ben', 'Mia', 'Tim', 'Nora', 'Jonas', 'Emma', 'Paul', 'Lea', 'Finn', 'Hanna', 'Luis', 'Zoe'];

  const used = new Set(MP.players.map(p => p.name.toLowerCase()));
  for (const nm of BOT_NAMES) { if (MP.players.filter(p => p.bot).length >= want) break; if (!used.has(nm.toLowerCase()) && nm.toLowerCase() !== me) { MP.players.push({id: 0, cid: 'bot' + nm, name: nm, bot: true, conn: true, mem: {}}); used.add(nm.toLowerCase()); } }
}
function cpuStart() {
